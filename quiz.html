<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGINX Journey Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --nginx-green: #009639; --nginx-green-hover: #007A2E; --nginx-green-glow: rgba(0,150,57,0.25); }
    .nginx-btn { background-color: var(--nginx-green); transition: all .2s ease; }
    .nginx-btn:hover { background-color: var(--nginx-green-hover); }
    .nginx-glow { box-shadow: 0 4px 20px var(--nginx-green-glow); }
    .q-text code, .opt-text code { background: rgb(30 41 59); padding: 0 .3em; border-radius: .25rem; color: rgb(167 243 208); font-size: .95em; }
    .q-text pre { background: rgb(2 6 23); border: 1px solid rgb(30 41 59); border-radius: .75rem; padding: .75rem 1rem; overflow-x: auto; margin: .5rem 0; font-weight: 400; }
    .q-text pre code { background: none; padding: 0; color: rgb(203 213 225); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased">

  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="quiz.html" class="flex items-center">
          <img src="https://nginx.org/img/nginx_logo.svg" alt="NGINX" class="h-8 w-auto" />
        </a>
        <div class="h-6 w-[1px] bg-slate-800 hidden sm:block"></div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold tracking-tight text-white text-sm">NGINX LEARNING JOURNEY</span>
            <span id="badge" class="hidden px-1.5 py-0.5 text-[9px] uppercase font-black tracking-wider rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30"></span>
          </div>
          <p id="subtitle" class="text-[11px] text-slate-400">Daily concept examinations</p>
        </div>
      </div>
      <button id="new-sample-btn" onclick="startNewExam()" class="hidden text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold">
        New Sample
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 space-y-6">
    <div id="overview"></div>
    <div id="questions-list" class="space-y-6">
      <div class="text-center py-12 text-slate-500 text-sm">Loading question pools...</div>
    </div>
    <div id="exam-footer" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 sticky bottom-4 shadow-2xl bg-opacity-95 flex-col sm:flex-row items-center justify-between gap-4">
      <div id="score-summary" class="text-sm font-semibold text-slate-300"></div>
      <div class="flex items-center gap-3">
        <button id="submit-btn" onclick="gradeExam()" class="nginx-btn text-white text-xs font-bold px-6 py-2.5 rounded-xl nginx-glow">Submit Exam &amp; Reveal Solutions</button>
        <button id="retry-btn" onclick="startNewExam()" class="hidden px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700">Take Another Sample</button>
      </div>
    </div>
  </main>

  <script>
    const DATA_URL = "data/quizzes.json";
    const LETTERS = ["A", "B", "C", "D"];
    const TYPE_LABELS = { scenario: "Scenario", config: "Read the Config", diagnose: "Diagnose", recall: "Recall" };

    let data, sprint, day, pool = [], current = [], answers = {}, graded = false, sampleSize = 10, passPercent = 80;

    function escapeHtml(s) {
      return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Minimal markdown: ```fenced``` blocks, `inline code`, **bold**, newlines
    function md(s) {
      const parts = String(s ?? "").split(/```[a-z]*\n?([\s\S]*?)```/g);
      return parts.map((p, i) => {
        if (i % 2) return `<pre><code>${escapeHtml(p.replace(/\n$/, ""))}</code></pre>`;
        return escapeHtml(p)
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/^\n+|\n+$/g, "")
          .replace(/\n/g, "<br>");
      }).join("");
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function storageKey() { return `nginx_quiz_s${sprint.sprint}_d${day.day}`; }

    function bestScore(sp, d) {
      try {
        const h = JSON.parse(localStorage.getItem(`nginx_quiz_s${sp}_d${d}`) || "[]");
        return h.length ? Math.max(...h.map(r => r.percentage)) : null;
      } catch (e) { return null; }
    }

    async function init() {
      try {
        const res = await fetch(DATA_URL, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        data = await res.json();
      } catch (e) {
        document.getElementById("questions-list").innerHTML = `
          <div class="bg-rose-950/30 border border-rose-500/30 rounded-2xl p-6 text-sm text-rose-200 space-y-2">
            <div class="font-bold">Could not load <code>${DATA_URL}</code> (${escapeHtml(e.message)}).</div>
            <div class="text-slate-300">Browsers block <code>fetch()</code> on <code>file://</code> pages. Serve the repo over HTTP:</div>
            <pre class="bg-slate-950 p-3 rounded-lg text-xs text-slate-300">cd /srv/nginx-journey && python3 -m http.server 8090
# then open http://&lt;lab-host&gt;:8090/quiz.html</pre>
          </div>`;
        return;
      }
      sampleSize = data.defaults?.sample_size ?? 10;
      passPercent = data.defaults?.pass_percent ?? 80;

      const params = new URLSearchParams(location.search);
      const sp = Number(params.get("sprint")), d = Number(params.get("day"));
      sprint = data.sprints.find(s => s.sprint === sp);
      day = sprint?.days.find(x => x.day === d);
      if (!day) return renderIndex();
      if (!day.questions.length) {
        document.getElementById("questions-list").innerHTML = `
          <div class="text-center py-12 text-slate-400 text-sm">Sprint ${sprint.sprint} Day ${day.day} (${escapeHtml(day.title)}) has no questions yet.
          <div class="mt-3"><a class="text-emerald-400 underline" href="quiz.html">All quizzes</a></div></div>`;
        return;
      }
      pool = day.questions;
      const badge = document.getElementById("badge");
      badge.textContent = `Sprint ${sprint.sprint} • Day ${day.day}`;
      badge.classList.remove("hidden");
      document.getElementById("subtitle").textContent = day.title;
      document.title = `S${sprint.sprint} D${day.day} Quiz • ${day.title}`;
      document.getElementById("new-sample-btn").classList.remove("hidden");
      const n = Math.min(sampleSize, pool.length);
      const need = Math.ceil(n * passPercent / 100);
      document.getElementById("overview").innerHTML = `
        <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-6 relative overflow-hidden shadow-xl">
          <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-emerald-600 via-[#009639] to-teal-400"></div>
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest">${escapeHtml(sprint.title)}${day.track === "enterprise" ? " • Enterprise" : ""}</span>
              <h1 class="text-2xl font-black text-white mt-1">${escapeHtml(day.title)}</h1>
              <p class="text-xs text-slate-400 mt-1">${n} random questions from a ${pool.length}-question pool, with answer order shuffled. Pass: ${passPercent}% (${need} of ${n}).</p>
            </div>
            <div class="text-right bg-slate-950/80 p-3 rounded-xl border border-slate-800">
              <div class="text-[10px] uppercase font-bold text-slate-400">Best Score</div>
              <div class="text-lg font-black text-white">${bestScore(sprint.sprint, day.day) ?? "—"}${bestScore(sprint.sprint, day.day) !== null ? "%" : ""}</div>
            </div>
          </div>
        </div>`;
      document.getElementById("exam-footer").classList.replace("hidden", "flex");
      startNewExam();
    }

    function renderIndex() {
      document.getElementById("questions-list").innerHTML = data.sprints.map(sp => `
        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 space-y-3">
          <div class="text-xs font-bold text-emerald-400 uppercase tracking-widest">Sprint ${sp.sprint}</div>
          <div class="text-lg font-black text-white">${escapeHtml(sp.title)}</div>
          <div class="divide-y divide-slate-800">
            ${sp.days.map(d => {
              const best = bestScore(sp.sprint, d.day);
              const ready = d.questions.length > 0;
              return `
                <div class="flex items-center justify-between py-2 text-sm">
                  <div>
                    <span class="text-slate-400">Day ${d.day}${d.date ? ` • ${d.date}` : ""}</span>
                    <span class="text-slate-200 ml-2">${escapeHtml(d.title)}</span>
                    ${d.track === "enterprise" ? '<span class="ml-2 text-[10px] uppercase font-bold text-amber-400">Enterprise</span>' : ""}
                  </div>
                  <div class="flex items-center gap-3">
                    ${best !== null ? `<span class="text-xs ${best >= passPercent ? "text-emerald-400" : "text-rose-400"}">best ${best}%</span>` : ""}
                    ${ready
                      ? `<a href="quiz.html?sprint=${sp.sprint}&day=${d.day}" class="nginx-btn text-white text-xs font-bold px-3 py-1.5 rounded-lg">Start</a>`
                      : '<span class="text-xs text-slate-500">coming soon</span>'}
                  </div>
                </div>`;
            }).join("")}
          </div>
        </div>`).join("");
    }

    function startNewExam() {
      graded = false;
      answers = {};
      // Shuffle option order per question so answer letters carry no signal
      current = shuffle(pool).slice(0, Math.min(sampleSize, pool.length)).map(q => {
        const order = shuffle(LETTERS.filter(k => q.options[k] !== undefined));
        return { ...q, order, correctPos: order.indexOf(q.answer) };
      });
      document.getElementById("submit-btn").classList.remove("hidden");
      document.getElementById("retry-btn").classList.add("hidden");
      document.getElementById("score-summary").textContent = `Answer all ${current.length} questions, then submit for grading and explanations.`;
      renderQuestions();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuestions() {
      document.getElementById("questions-list").innerHTML = current.map((q, idx) => `
        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 space-y-4" id="q-${idx}">
          <div class="flex items-center justify-between text-xs gap-2">
            <span class="font-extrabold text-emerald-400">QUESTION ${idx + 1} OF ${current.length}</span>
            <span class="flex gap-2">
              <span class="px-2.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700/60">${escapeHtml(TYPE_LABELS[q.type] || q.type || "")}</span>
              <span class="px-2.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700/60">${escapeHtml(q.category)}</span>
            </span>
          </div>
          <div class="q-text text-sm font-bold text-white leading-relaxed">${md(q.question)}</div>
          <div class="space-y-2 pt-2">
            ${q.order.map((key, pos) => `
              <label id="opt-${idx}-${pos}" class="flex items-start gap-3 p-3 rounded-xl border border-slate-800 hover:border-slate-700 bg-slate-950/40 cursor-pointer text-xs text-slate-300">
                <input type="radio" name="q_${idx}" onchange="answers[${idx}] = ${pos}" class="mt-0.5 accent-[#009639]">
                <span class="opt-text"><strong class="text-slate-200">${LETTERS[pos]})</strong> ${md(q.options[key])}</span>
              </label>`).join("")}
          </div>
          <div id="exp-${idx}" class="hidden p-4 rounded-xl text-xs space-y-1"></div>
        </div>`).join("");
    }

    function gradeExam() {
      if (graded) return;
      graded = true;
      let score = 0;
      current.forEach((q, idx) => {
        const picked = answers[idx];
        const ok = picked === q.correctPos;
        if (ok) score++;
        document.querySelectorAll(`input[name="q_${idx}"]`).forEach(i => i.disabled = true);
        const exp = document.getElementById(`exp-${idx}`);
        exp.className = `p-4 rounded-xl text-xs space-y-1 opt-text ${ok
          ? "bg-emerald-950/30 border border-emerald-500/30"
          : "bg-rose-950/30 border border-rose-500/30"}`;
        exp.innerHTML = `
          <div class="font-extrabold ${ok ? "text-emerald-400" : "text-rose-400"}">
            ${ok ? "&check; Correct" : `&cross; ${picked === undefined ? "Unanswered" : "Incorrect"}. Correct answer: ${LETTERS[q.correctPos]}`}
          </div>
          <div class="text-slate-300 leading-relaxed">${md(q.explanation)}</div>`;
        q.order.forEach((_, pos) => {
          const el = document.getElementById(`opt-${idx}-${pos}`);
          if (pos === q.correctPos) el.classList.add("border-emerald-500", "bg-emerald-950/20");
          else if (pos === picked) el.classList.add("border-rose-500", "bg-rose-950/20");
        });
      });

      const total = current.length;
      const percentage = Math.round(score / total * 100);
      const passed = percentage >= passPercent;
      document.getElementById("score-summary").innerHTML = `
        <div class="flex items-center gap-3 flex-wrap">
          <span class="text-2xl font-black ${passed ? "text-[#009639]" : "text-rose-400"}">Score: ${score} / ${total} (${percentage}%)</span>
          <span class="px-2.5 py-1 rounded text-xs font-black uppercase tracking-wider ${passed
            ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"
            : "bg-rose-500/20 text-rose-300 border border-rose-500/30"}">
            ${passed ? `Passed • Day ${day.day} complete` : "Needs review • re-attempt"}
          </span>
        </div>`;
      document.getElementById("submit-btn").classList.add("hidden");
      document.getElementById("retry-btn").classList.remove("hidden");

      try {
        const h = JSON.parse(localStorage.getItem(storageKey()) || "[]");
        h.push({ score, total, percentage, passed, ids: current.map(q => q.id), date: new Date().toISOString() });
        localStorage.setItem(storageKey(), JSON.stringify(h));
      } catch (e) {}
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
