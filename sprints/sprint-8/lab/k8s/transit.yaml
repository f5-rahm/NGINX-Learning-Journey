# Copperline Transit: the applications in namespace 'transit'. Applied by ./lab.sh up and ./lab.sh reset.
# Do not edit this file for the labs: copy what you need into lab/work/ (Day 3 and the sprint lab tell you when).
---
apiVersion: v1
kind: Namespace
metadata:
  name: transit
---
# The public website. It has a readiness probe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v1
  namespace: transit
  labels: {app: web, version: v1}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web, version: v1}
  template:
    metadata:
      labels: {app: web, version: v1}
    spec:
      containers:
      - name: app
        image: python:3.12-alpine
        command: ["python3", "-u", "/code/app.py"]
        ports:
        - {name: http, containerPort: 8080}
        env:
        - {name: APP, value: "web"}
        - {name: VERSION, value: "v1"}
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        readinessProbe:                  # the pod receives traffic only while /healthz answers 2xx
          httpGet: {path: /healthz, port: http}
          periodSeconds: 2
          failureThreshold: 1
        volumeMounts:
        - {name: code, mountPath: /code}
      volumes:
      - name: code
        configMap: {name: app-code}    # app.py, created by lab.sh from lab/app.py
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: transit
spec:
  type: ClusterIP
  selector: {app: web}
  ports:
  - {name: http, port: 80, targetPort: http}
---
# The arrivals API, current version. It takes 3 s to start and exits at once on SIGTERM.
# No readiness probe and no preStop hook: Day 3 is about what that costs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arrivals-v1
  namespace: transit
  labels: {app: arrivals, version: v1}
spec:
  replicas: 3
  selector:
    matchLabels: {app: arrivals, version: v1}
  template:
    metadata:
      labels: {app: arrivals, version: v1}
    spec:
      containers:
      - name: app
        image: python:3.12-alpine
        command: ["python3", "-u", "/code/app.py"]
        ports:
        - {name: http, containerPort: 8080}
        env:
        - {name: APP, value: "arrivals"}
        - {name: VERSION, value: "v1"}
        - {name: STARTUP_DELAY, value: "3"}
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        volumeMounts:
        - {name: code, mountPath: /code}
      volumes:
      - name: code
        configMap: {name: app-code}    # app.py, created by lab.sh from lab/app.py
---
# Selects v1 only.
apiVersion: v1
kind: Service
metadata:
  name: arrivals
  namespace: transit
spec:
  type: ClusterIP
  selector: {app: arrivals, version: v1}
  ports:
  - {name: http, port: 80, targetPort: http}
---
# The arrivals API, next version (the canary).
