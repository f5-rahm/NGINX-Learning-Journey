---
# The dispatchers' console.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-v1
  namespace: transit
  labels: {app: dispatch, version: v1}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dispatch, version: v1}
  template:
    metadata:
      labels: {app: dispatch, version: v1}
    spec:
      containers:
      - name: app
        image: python:3.12-alpine
        command: ["python3", "-u", "/code/app.py"]
        ports:
        - {name: http, containerPort: 8080}
        env:
        - {name: APP, value: "dispatch"}
        - {name: VERSION, value: "v1"}
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        volumeMounts:
        - {name: code, mountPath: /code}
      volumes:
      - name: code
        configMap: {name: app-code}    # app.py, created by lab.sh from lab/app.py
---
apiVersion: v1
kind: Service
metadata:
  name: dispatch
  namespace: transit
spec:
  type: ClusterIP
  selector: {app: dispatch}
  ports:
  - {name: http, port: 80, targetPort: http}
---
# A client inside the cluster, for requests that must come from a pod.
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: transit
  labels: {app: client}
spec:
  containers:
  - name: curl
    image: curlimages/curl:8.16.0
    command: ["sleep", "infinity"]
