# Copperline Transit: the fares team's namespace. Applied by ./lab.sh up and ./lab.sh reset.
---
apiVersion: v1
kind: Namespace
metadata:
  name: fares
---
# The fares API, owned by the fares team.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fares-v1
  namespace: fares
  labels: {app: fares, version: v1}
spec:
  replicas: 2
  selector:
    matchLabels: {app: fares, version: v1}
  template:
    metadata:
      labels: {app: fares, version: v1}
    spec:
      containers:
      - name: app
        image: python:3.12-alpine
        command: ["python3", "-u", "/code/app.py"]
        ports:
        - {name: http, containerPort: 8080}
        env:
        - {name: APP, value: "fares"}
        - {name: VERSION, value: "v1"}
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        readinessProbe:                  # the pod receives traffic only while /healthz answers 2xx
          httpGet: {path: /healthz, port: http}
          periodSeconds: 2
          failureThreshold: 1
        volumeMounts:
        - {name: code, mountPath: /code}
      volumes:
      - name: code
        configMap: {name: app-code}    # app.py, created by lab.sh from lab/app.py
---
apiVersion: v1
kind: Service
metadata:
  name: fares
  namespace: fares
spec:
  type: ClusterIP
  selector: {app: fares}
  ports:
  - {name: http, port: 80, targetPort: http}
