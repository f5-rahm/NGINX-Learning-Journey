<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250" font-family="Lato" xml:space="preserve">
<rect x="0" y="0" width="1200" height="1250" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="24" y="44" font-size="28" fill="#1F1F1F" font-weight="bold" text-anchor="start">Limits as a policy, not whack-a-mole</text>
<text x="24" y="74" font-size="15.5" fill="#555555" text-anchor="start">Bound every phase of a request, set the values in three layers, and take the numbers from two budgets.</text>
<circle cx="38" cy="118" r="14" fill="#1F1F1F"/>
<text x="38" y="123" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<text x="62" y="124" font-size="15" fill="#1F1F1F" font-weight="bold" text-anchor="start">BOUND EVERY PHASE OF THE REQUEST</text>
<rect x="24" y="146" width="1152" height="30" rx="0" fill="#F5F5F4" stroke="none" stroke-width="1"/>
<text x="36" y="166" font-size="12" fill="#555555" font-weight="bold" text-anchor="start">PHASE</text>
<text x="242" y="166" font-size="12" fill="#555555" font-weight="bold" text-anchor="start">TIME</text>
<text x="572" y="166" font-size="12" fill="#555555" font-weight="bold" text-anchor="start">SIZE</text>
<text x="872" y="166" font-size="12" fill="#555555" font-weight="bold" text-anchor="start">COUNT / RATE</text>
<line x1="24" y1="176" x2="1176" y2="176" stroke="#D6D3D1" stroke-width="1"/>
<text x="36" y="199" font-size="14.5" fill="#1F1F1F" font-weight="bold" text-anchor="start">Idle connection</text>
<text x="242" y="199" font-size="12.5" fill="#1565C0" font-family="DejaVu Sans Mono" text-anchor="start">keepalive_timeout</text>
<text x="572" y="199" font-size="12.5" fill="#A8A29E" text-anchor="start">n/a</text>
<text x="872" y="199" font-size="12.5" fill="#1565C0" font-family="DejaVu Sans Mono" text-anchor="start">keepalive_requests</text>
<line x1="24" y1="212" x2="1176" y2="212" stroke="#D6D3D1" stroke-width="1"/>
<text x="36" y="235" font-size="14.5" fill="#1F1F1F" font-weight="bold" text-anchor="start">Request header</text>
<text x="242" y="235" font-size="12.5" fill="#1565C0" font-family="DejaVu Sans Mono" text-anchor="start">client_header_timeout (total)</text>
<text x="572" y="235" font-size="12.5" fill="#1565C0" font-family="DejaVu Sans Mono" text-anchor="start">large_client_header_buffers</text>
<text x="872" y="235" font-size="12.5" fill="#1565C0" font-family="DejaVu Sans Mono" text-anchor="start">limit_req</text>
<line x1="24" y1="248" x2="1176" y2="248" stroke="#D6D3D1" stroke-width="1"/>
<text x="36" y="271" font-size="14.5" fill="#1F1F1F" font-weight="bold" text-anchor="start">Request body</text>
<text x="242" y="271" font-size="12.5" fill="#1565C0" font-family="DejaVu Sans Mono" text-anchor="start">client_body_timeout (gap)</text>
<text x="572" y="271" font-size="12.5" fill="#1565C0" font-family="DejaVu Sans Mono" text-anchor="start">client_max_body_size</text>
<text x="872" y="271" font-size="12.5" fill="#1565C0" font-family="DejaVu Sans Mono" text-anchor="start">limit_conn</text>
<line x1="24" y1="284" x2="1176" y2="284" stroke="#D6D3D1" stroke-width="1"/>
<text x="36" y="307" font-size="14.5" fill="#1F1F1F" font-weight="bold" text-anchor="start">Processing</text>
<text x="242" y="307" font-size="12.5" fill="#1565C0" font-family="DejaVu Sans Mono" text-anchor="start">proxy_read_timeout</text>
<text x="572" y="307" font-size="12.5" fill="#A8A29E" text-anchor="start">n/a</text>
<text x="872" y="307" font-size="12.5" fill="#1565C0" font-family="DejaVu Sans Mono" text-anchor="start">limit_conn, max_conns</text>
<line x1="24" y1="320" x2="1176" y2="320" stroke="#D6D3D1" stroke-width="1"/>
<text x="36" y="343" font-size="14.5" fill="#1F1F1F" font-weight="bold" text-anchor="start">Response</text>
<text x="242" y="343" font-size="12.5" fill="#1565C0" font-family="DejaVu Sans Mono" text-anchor="start">send_timeout (gap)</text>
<text x="572" y="343" font-size="12.5" fill="#A8A29E" text-anchor="start">n/a</text>
<text x="872" y="343" font-size="12.5" fill="#1565C0" font-family="DejaVu Sans Mono" text-anchor="start">limit_rate + limit_conn</text>
<line x1="24" y1="356" x2="1176" y2="356" stroke="#D6D3D1" stroke-width="1"/>
<text x="24" y="386" font-size="14" fill="#555555" text-anchor="start">Check that every cell has an explicit value. A new attack then shows which value was too loose; it doesn't call for a new directive.</text>
<circle cx="38" cy="436" r="14" fill="#1F1F1F"/>
<text x="38" y="441" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text>
<text x="62" y="442" font-size="15" fill="#1F1F1F" font-weight="bold" text-anchor="start">THREE LAYERS, LIKE PARENT AND CHILD PROFILES</text>
<text x="1176" y="442" font-size="12" fill="#555555" font-weight="bold" text-anchor="end">ON BIG-IP</text>
<rect x="24" y="462" width="1152" height="96" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
<rect x="24" y="462" width="8" height="96" rx="0" fill="#2E7D32" stroke="none" stroke-width="1"/>
<text x="52" y="494" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="start">Baseline</text>
<text x="52" y="518" font-size="13" fill="#1F1F1F" font-family="DejaVu Sans Mono" text-anchor="start">http { }</text>
<text x="300" y="494" font-size="14.5" fill="#1F1F1F" text-anchor="start">An explicit value for every cell, tighter than the defaults where they</text>
<text x="300" y="515" font-size="14.5" fill="#1F1F1F" text-anchor="start">are generous. A per-client limit_conn as a backstop.</text>
<text x="1156" y="518" font-size="14" fill="#555555" text-anchor="end">custom parent profile</text>
<path d="M140,560 L140,570" stroke="#555555" stroke-width="2"/>
<path d="M134,566 L140,573 L146,566" fill="none" stroke="#555555" stroke-width="2"/>
<rect x="24" y="574" width="1152" height="96" rx="10" fill="#FFF4E0" stroke="#B45309" stroke-width="1"/>
<rect x="24" y="574" width="8" height="96" rx="0" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="52" y="606" font-size="19" fill="#B45309" font-weight="bold" text-anchor="start">Traffic classes</text>
<text x="52" y="630" font-size="13" fill="#1F1F1F" font-family="DejaVu Sans Mono" text-anchor="start">one include file per class</text>
<text x="300" y="606" font-size="14.5" fill="#1F1F1F" text-anchor="start">Each class changes only what its legitimate traffic needs.</text>
<rect x="300" y="628" width="42.8" height="24" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
<text x="321.4" y="644.5" font-size="12.5" fill="#B45309" font-weight="bold" text-anchor="middle">API</text>
<rect x="350.8" y="628" width="65.6" height="24" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
<text x="383.6" y="644.5" font-size="12.5" fill="#B45309" font-weight="bold" text-anchor="middle">static</text>
<rect x="424.4" y="628" width="73.19999999999999" height="24" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
<text x="461.0" y="644.5" font-size="12.5" fill="#B45309" font-weight="bold" text-anchor="middle">uploads</text>
<rect x="505.59999999999997" y="628" width="88.39999999999999" height="24" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
<text x="549.8" y="644.5" font-size="12.5" fill="#B45309" font-weight="bold" text-anchor="middle">downloads</text>
<rect x="602.0" y="628" width="58.0" height="24" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
<text x="631.0" y="644.5" font-size="12.5" fill="#B45309" font-weight="bold" text-anchor="middle">admin</text>
<text x="1156" y="630" font-size="14" fill="#555555" text-anchor="end">child profiles on many VSs</text>
<path d="M140,672 L140,682" stroke="#555555" stroke-width="2"/>
<path d="M134,678 L140,685 L146,678" fill="none" stroke="#555555" stroke-width="2"/>
<rect x="24" y="686" width="1152" height="96" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1"/>
<rect x="24" y="686" width="8" height="96" rx="0" fill="#1565C0" stroke="none" stroke-width="1"/>
<text x="52" y="718" font-size="19" fill="#1565C0" font-weight="bold" text-anchor="start">Client tiers</text>
<text x="52" y="742" font-size="13" fill="#1F1F1F" font-family="DejaVu Sans Mono" text-anchor="start">geo + map</text>
<text x="300" y="718" font-size="14.5" fill="#1F1F1F" text-anchor="start">Client address → tier → key and rate, managed in one place.</text>
<rect x="300" y="740" width="73.19999999999999" height="24" rx="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="1"/>
<text x="336.6" y="756.5" font-size="12.5" fill="#1565C0" font-weight="bold" text-anchor="middle">partner</text>
<rect x="381.2" y="740" width="65.6" height="24" rx="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="1"/>
<text x="414.0" y="756.5" font-size="12.5" fill="#1565C0" font-weight="bold" text-anchor="middle">office</text>
<rect x="454.79999999999995" y="740" width="80.8" height="24" rx="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="1"/>
<text x="495.19999999999993" y="756.5" font-size="12.5" fill="#1565C0" font-weight="bold" text-anchor="middle">internet</text>
<text x="1156" y="742" font-size="14" fill="#555555" text-anchor="end">data group lookups</text>
<text x="24" y="806" font-size="13.5" fill="#555555" text-anchor="start">Each layer inherits from the one above and overrides it only where it must. In NGINX a location with its own limit_req drops the inherited ones, so repeat them.</text>
<circle cx="38" cy="856" r="14" fill="#1F1F1F"/>
<text x="38" y="861" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<text x="62" y="862" font-size="15" fill="#1F1F1F" font-weight="bold" text-anchor="start">THE NUMBERS COME FROM TWO BUDGETS, NOT FROM THE LAST ATTACK</text>
<rect x="24" y="882" width="564" height="176" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="1"/>
<text x="46" y="916" font-size="19" fill="#C62828" font-weight="bold" text-anchor="start">Capacity, from the top</text>
<text x="46" y="946" font-size="14.5" fill="#1F1F1F" text-anchor="start">What the gateway and the origin can hold at once:</text>
<text x="46" y="967" font-size="14.5" fill="#1F1F1F" text-anchor="start">worker connections, file descriptors, the origin's</text>
<text x="46" y="988" font-size="14.5" fill="#1F1F1F" text-anchor="start">real concurrency.</text>
<line x1="46" y1="1014" x2="566" y2="1014" stroke="#C62828" stroke-width="1"/>
<text x="46" y="1040" font-size="13.5" fill="#1F1F1F" font-weight="bold" text-anchor="start">Sets the server-wide caps: a $server_name limit_conn, max_conns.</text>
<rect x="612" y="882" width="564" height="176" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
<text x="634" y="916" font-size="19" fill="#2E7D32" font-weight="bold" text-anchor="start">Real clients, from the bottom</text>
<text x="634" y="946" font-size="14.5" fill="#1F1F1F" text-anchor="start">The p99 of legitimate traffic from the access log</text>
<text x="634" y="967" font-size="14.5" fill="#1F1F1F" text-anchor="start">(rate, requests in progress, body size, upload</text>
<text x="634" y="988" font-size="14.5" fill="#1F1F1F" text-anchor="start">time), times a margin of 2–3.</text>
<line x1="634" y1="1014" x2="1154" y2="1014" stroke="#2E7D32" stroke-width="1"/>
<text x="634" y="1040" font-size="13.5" fill="#1F1F1F" font-weight="bold" text-anchor="start">Sets the per-client limits. Timeouts: the slowest client you serve.</text>
<text x="24" y="1088" font-size="13.5" fill="#555555" text-anchor="start">If a per-client limit would sit below the p99 of real clients, the class or the key is wrong (many clients behind one NAT or load balancer).</text>
<text x="24" y="1132" font-size="13" fill="#555555" font-weight="bold" text-anchor="start">ROLL OUT LIKE A PROFILE CHANGE</text>
<rect x="24" y="1146" width="360" height="44" rx="22" fill="#F5F5F4" stroke="#D6D3D1" stroke-width="1"/>
<text x="48" y="1174" font-size="15" fill="#1F1F1F" font-weight="bold" text-anchor="start">Dry run</text>
<text x="125" y="1174" font-size="13" fill="#555555" font-family="DejaVu Sans Mono" text-anchor="start">log $limit_req_status</text>
<path d="M392,1168 L406,1168 M400,1162 L406,1168 L400,1174" fill="none" stroke="#555555" stroke-width="2"/>
<rect x="420" y="1146" width="360" height="44" rx="22" fill="#F5F5F4" stroke="#D6D3D1" stroke-width="1"/>
<text x="444" y="1174" font-size="15" fill="#1F1F1F" font-weight="bold" text-anchor="start">Enforce</text>
<text x="521" y="1174" font-size="13" fill="#555555" font-family="DejaVu Sans Mono" text-anchor="start">429 + Retry-After</text>
<path d="M788,1168 L802,1168 M796,1162 L802,1168 L796,1174" fill="none" stroke="#555555" stroke-width="2"/>
<rect x="816" y="1146" width="360" height="44" rx="22" fill="#F5F5F4" stroke="#D6D3D1" stroke-width="1"/>
<text x="840" y="1174" font-size="15" fill="#1F1F1F" font-weight="bold" text-anchor="start">Watch</text>
<text x="899" y="1174" font-size="14" fill="#555555" text-anchor="start">rejection rates as a metric</text>
<text x="24" y="1230" font-size="12.5" fill="#A8A29E" text-anchor="start">NGINX Learning Journey · Sprint 5 Day 2 · design guidance, not lab measurements</text>
</svg>
