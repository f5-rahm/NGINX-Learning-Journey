<text x="24.0" y="148.0" font-size="12" fill="#555555" font-weight="bold" text-anchor="start">THE LIMIT</text>
<text x="372.0" y="148.0" font-size="12" fill="#555555" font-weight="bold" text-anchor="start">WHAT EACH REQUEST GOT, OVER TIME</text>
<text x="990.0" y="148.0" font-size="12" fill="#555555" font-weight="bold" text-anchor="start">RESULT</text>
<line x1="24" y1="160" x2="1176" y2="160" stroke="#D6D3D1"/>
<text x="24.0" y="186.0" font-size="18" fill="#1F1F1F" font-weight="bold" text-anchor="start">1</text>
<text x="46.0" y="186.0" font-size="12.5" fill="#1F1F1F" font-weight="bold" font-family="DejaVu Sans Mono" text-anchor="start">limit_req zone=api;</text>
<text x="46.0" y="210.0" font-size="13.5" fill="#555555" text-anchor="start">No burst. A request must arrive</text>
<text x="46.0" y="229.0" font-size="13.5" fill="#555555" text-anchor="start">100 ms after the last answered one,</text>
<text x="46.0" y="248.0" font-size="13.5" fill="#555555" text-anchor="start">or it is rejected.</text>
