<text x="24.0" y="42.0" font-size="26" fill="#1F1F1F" font-weight="bold" text-anchor="start">Same traffic, three limits: burst decides how many, nodelay decides when</text>
<text x="24.0" y="70.0" font-size="14.5" fill="#555555" text-anchor="start">rate=10r/s means one slot every 100 ms. One client sends 8 requests at once, then 4 more at 350 ms. Every dot below was measured on the lab (nginx 1.31.6).</text>
