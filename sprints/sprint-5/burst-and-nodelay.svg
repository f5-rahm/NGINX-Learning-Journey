<line x1="24" y1="773" x2="1176" y2="773" stroke="#D6D3D1"/>
<text x="24.0" y="807.0" font-size="17" fill="#1F1F1F" font-weight="bold" text-anchor="start">Reading the bucket</text>
<text x="24" y="833" font-size="14.5" fill="#1F1F1F">Each answered request adds 1; time drains 1 every 100 ms. A request that would push it above <tspan font-family="DejaVu Sans Mono" font-weight="bold">burst</tspan> is rejected.</text>
<text x="24" y="854" font-size="14.5" fill="#1F1F1F">At 0 ms the 6th request fills it to 5, so the 7th and 8th are rejected. By 350 ms it has drained to 1.5,<tspan font-family="DejaVu Sans Mono" font-weight="bold"></tspan></text>
<text x="24" y="875" font-size="14.5" fill="#1F1F1F">so 3 more fit (up to 4.5) and the 4th is rejected. That math is identical with and without <tspan font-family="DejaVu Sans Mono" font-weight="bold">nodelay</tspan>.</text>
<rect x="24" y="888" width="1152" height="36" rx="8" fill="#E3F2FD" stroke="#1565C0"/>
<text x="40" y="912" font-size="15" fill="#1565C0" font-weight="bold"><tspan font-family="DejaVu Sans Mono">burst</tspan> turns the strict gap of lane 1 into a tolerance, and <tspan font-family="DejaVu Sans Mono">nodelay</tspan> decides whether the requests inside the tolerance wait.</text>
</svg>
