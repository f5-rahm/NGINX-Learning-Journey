<text x="990.0" y="192.0" font-size="14.5" fill="#1F1F1F" font-weight="bold" text-anchor="start">2 answered, 10 rejected</text>
<text x="990.0" y="213.0" font-size="13.5" fill="#555555" text-anchor="start">One request per 100 ms gap.</text>
<text x="990.0" y="234.0" font-size="13.5" fill="#555555" text-anchor="start">By 350 ms the gap has passed,</text>
<text x="990.0" y="255.0" font-size="13.5" fill="#555555" text-anchor="start">so exactly one more gets in.</text>
<line x1="24" y1="321" x2="1176" y2="321" stroke="#D6D3D1"/>
<text x="24.0" y="353.0" font-size="18" fill="#1F1F1F" font-weight="bold" text-anchor="start">2</text>
<text x="46.0" y="353.0" font-size="12.5" fill="#1F1F1F" font-weight="bold" font-family="DejaVu Sans Mono" text-anchor="start">limit_req zone=api burst=5;</text>
<text x="46.0" y="377.0" font-size="13.5" fill="#555555" text-anchor="start">The bucket holds 5 extra. Extras</text>
<text x="46.0" y="396.0" font-size="13.5" fill="#555555" text-anchor="start">wait in a queue: each one is held</text>
<text x="46.0" y="415.0" font-size="13.5" fill="#555555" text-anchor="start">for its excess × 100 ms.</text>
