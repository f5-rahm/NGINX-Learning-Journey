# Sprint 5 lab solution: the Lumina API Gateway
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format gw '$remote_addr "$request" $status rt=$request_time '
                  'req=$limit_req_status conn=$limit_conn_status via=$realip_remote_addr';
    access_log logs/access.log gw;

    # Real client address first (POST_READ phase): everything below sees it
    set_real_ip_from  10.55.0.5;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    geo $tier {
        default        internet;
        10.55.10.0/24  ops;
        10.55.20.0/24  partner;
        10.55.66.0/24  blocked;
    }

    # An empty key is never limited: partners are exempt
    map $tier $client_key {
        partner  "";
        default  $binary_remote_addr;
    }
    map $tier $origin_key {
        partner  "";
        default  $server_name;
    }
    map $tier $download_rate {
        partner  0;
        default  512k;
    }

    limit_req_zone  $client_key          zone=api:10m    rate=10r/s;
    limit_req_zone  $binary_remote_addr  zone=login:10m  rate=5r/m;
    limit_conn_zone $client_key          zone=per_client:10m;
    limit_conn_zone $origin_key          zone=origin:1m;
    limit_conn_zone $binary_remote_addr  zone=downloads:10m;
    limit_req_status  429;
    limit_conn_status 429;

    client_header_timeout 10s;

    upstream api {
        server s5-origin:8015;
    }

    server {
        listen 8095;
        server_name lumina;

        # The rewrite phase runs before limit_req/limit_conn (PREACCESS) and allow/deny (ACCESS),
        # so blocked clients get 403 every time and never touch the limit zones
        if ($tier = blocked) {
            return 403;
        }

        error_page 429 @too_many;
        location @too_many {
            add_header Retry-After 1 always;
            return 429 "{\"error\": \"too many requests\"}\n";
        }

        location /api/ {
            proxy_pass http://api;
            limit_req  zone=api burst=20 nodelay;
            limit_conn per_client 4;
            limit_conn origin 20;
            client_max_body_size 2m;
        }

        location /api/login {
            proxy_pass http://api;
            limit_req zone=login burst=4 nodelay;
        }

        location /downloads/ {
            proxy_pass http://api;
            limit_rate_after 256k;
            limit_rate       $download_rate;
            limit_conn       downloads 1;
        }

        location /admin/ {
            proxy_pass http://api;
            allow 10.55.10.0/24;
            deny  all;
        }

        location / {
            proxy_pass http://api;
        }
    }
}
