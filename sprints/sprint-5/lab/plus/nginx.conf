# Sprint 5 Day 3 Enterprise Side Quest: a two-node NGINX Plus gateway cluster
# The same file is mounted into both nodes, s5-plus-a (10.55.0.31) and s5-plus-b (10.55.0.32),
# as /etc/nginx/nginx.conf (see day_03_enterprise.md). Licensing uses the defaults.
user  nginx;
worker_processes  2;
error_log  stderr notice;                      # docker logs s5-plus-a
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

stream {
    # zone_sync: the nodes share the shared memory zones marked "sync" below
    server {
        listen 9000;
        zone_sync;
        zone_sync_server 10.55.0.31:9000;
        zone_sync_server 10.55.0.32:9000;
    }
}

http {
    log_format gw '$hostname $remote_addr "$request" $status req=$limit_req_status denied=$denied';
    access_log /dev/stdout gw;

    # Part A: a denylist the API can change while traffic flows. type=ip: keys are addresses or CIDR ranges.
    keyval_zone zone=denylist:1m type=ip timeout=1h sync;
    keyval $remote_addr $denied zone=denylist;

    # Part B: the same per-client limit, once per node and once for the cluster
    limit_req_zone $binary_remote_addr zone=per_node:1m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=cluster:1m rate=2r/s sync;
    limit_req_status 429;

    upstream api {
        zone api 64k;
        server s5-origin:8015;
    }

    server {
        listen 8096;
        status_zone gateway;

        if ($denied) {
            return 403;
        }

        location /api/ {
            limit_req zone=cluster burst=2 nodelay;
            proxy_pass http://api;
        }

        location /legacy/ {
            limit_req zone=per_node burst=2 nodelay;
            proxy_pass http://api;
        }
    }

    # Management: API (write access) and dashboard. Published on the host's loopback only;
    # inside the lab network, only the host (the network's gateway address) may use it.
    server {
        listen 8085;
        allow 10.55.0.1;
        deny  all;
        location /api/ {
            api write=on;
        }
        location = /dashboard.html {
            root /usr/share/nginx/html;
        }
    }
}
