# Sprint 5 Day 3 starting point: Day 1's rate limit, Day 2's concurrency, bandwidth and slow-client limits,
# and an /admin/ location
# cp day3_nginx.conf nginx.conf && ./lab.sh up   (or ./lab.sh reload if the lab is already up)
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format gw '$remote_addr "$request" $status rt=$request_time '
                  'req=$limit_req_status conn=$limit_conn_status';
    access_log logs/access.log gw;

    # Day 1: 10 requests/s per client, bursts of 20 answered at once, 429 with Retry-After
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    # Day 2: concurrency per client, one download at a time at 512 KB/s after the first 256 KB
    limit_conn_zone $binary_remote_addr zone=per_client:10m;
    limit_conn_zone $binary_remote_addr zone=downloads:10m;
    limit_conn_status 429;
    client_header_timeout 10s;

    map $limit_req_status$limit_conn_status $retry_after {
        ~REJECTED  1;
        default   "";
    }

    upstream api {
        server s5-origin:8015;
    }

    server {
        listen 8095;

        add_header Retry-After $retry_after always;

        location /api/ {
            proxy_pass http://api;
            limit_req zone=api burst=20 nodelay;
            limit_conn per_client 4;
            client_max_body_size 2m;
        }

        location /downloads/ {
            proxy_pass http://api;
            limit_conn downloads 1;
            limit_rate_after 256k;
            limit_rate 512k;
        }

        location /admin/ {
            proxy_pass http://api;
        }

        location / {
            proxy_pass http://api;
        }
    }
}
