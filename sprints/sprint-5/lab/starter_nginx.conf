# Sprint 5 lab starter: the Lumina API Gateway
# Copy to nginx.conf, complete the TODOs, then from sprints/sprint-5/lab:  ./lab.sh reload
# Requirements: ../README.md section 4. Test: ../test_sprint05.sh
#
# The lab network (10.55.0.0/16):
#   10.55.0.5       the load balancer in front of the gateway
#   10.55.10.0/24   the operations network
#   10.55.20.0/24   the partner network
#   10.55.66.0/24   an abusive network
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format gw '$remote_addr "$request" $status rt=$request_time '
                  'req=$limit_req_status conn=$limit_conn_status';
    access_log logs/access.log gw;

    upstream api {
        server s5-origin:8015;
    }

    server {
        listen 8095;

        # TODO: Requests arriving from the load balancer are treated as coming from the client address it
        #       reports in X-Forwarded-For. X-Forwarded-For from anyone else is ignored.
        # TODO: Every request from the abusive network gets 403, however many it sends.
        # TODO: Requests refused by a rate or concurrency limit get 429 and a "Retry-After: 1" header.
        # TODO: A client that hasn't sent its complete request headers within 10 seconds is disconnected.

        location /api/ {
            proxy_pass http://api;

            # TODO: Each client may make 10 requests per second, and bursts of up to 20 extra requests
            #       are answered without delay.
            # TODO: Each client may have at most 4 requests in progress at once.
            # TODO: At most 20 requests are in progress at the origin, across all clients.
            # TODO: Request bodies up to 2 MB are accepted; larger ones get 413.
            # TODO: The partner network is exempt from all of this location's rate and concurrency limits.
        }

        location /api/login {
            proxy_pass http://api;

            # TODO: Each client gets 5 login attempts in quick succession, then one more every 12 seconds.
        }

        location /downloads/ {
            proxy_pass http://api;

            # TODO: The first 256 KB of each download goes at full speed, then 512 KB/s.
            #       The partner network always downloads at full speed.
            # TODO: Each client may run one download at a time.
        }

        location /admin/ {
            proxy_pass http://api;

            # TODO: Only the operations network may use /admin/; everyone else gets 403.
        }

        location / {
            proxy_pass http://api;
        }
    }
}
