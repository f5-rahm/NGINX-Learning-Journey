# Sprint 5 Day 1 starting point: the gateway proxies the Lumina API, with no limits yet
# cp day1_nginx.conf nginx.conf && ./lab.sh up   (or ./lab.sh reload if the lab is already up)
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format gw '$remote_addr "$request" $status rt=$request_time '
                  'req=$limit_req_status conn=$limit_conn_status';
    access_log logs/access.log gw;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $http_x_api_key zone=by_key:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=tiny:32k rate=1r/m;
    limit_req_status 429;

    map $limit_req_status $retry_after {
	    REJECTED 1;
	    default "";
    }

    upstream api {
        server s5-origin:8015;
    }

    server {
        listen 8095;
	limit_req zone=api burst=20 nodelay;
	add_header Retry-After $retry_after always;

        location /api/ {
            proxy_pass http://api;
	    limit_req zone=api burst=20 nodelay;
	    limit_req zone=by_key burst=2 nodelay;
        }

	location /tiny/ {
		proxy_pass http://api;
		limit_req zone=tiny;
	}

        location / {
            proxy_pass http://api;

#	    limit_req_dry_run on;
        }
    }
}
