# Sprint 1, Day 2 starter config: Northwind static web tier
# Day 2 setup copies this file to nginx.conf in /srv/nginx-journey/sprints/sprint-1/lab;
# edit nginx.conf during the activities, then: ngx -t && ngx -s reload
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

#events { worker_connections 1024; debug_connection 127.0.0.1; }
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  text/plain;
    access_log    logs/access.log;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    # TODO (Activity 3.3): hide the NGINX version in the Server header
    server_tokens off;

    server {
        listen 8081;
        server_name shop.northwind.local;
        root www;                                  # storefront lives in www/

        add_header X-Worker-PID $pid always;       # watch this header in Activity 3.3

        location = /healthz { return 200 "OK\n"; }

        location / {
            index index.html;
        }

        # --- Activity 3.1: location precedence showdown ---
        location = /test        { return 200 "Exact match wins\n"; }
        location ^~ /test/      { return 200 "Preferential prefix ^~ wins\n"; }
        location ~* \.png$      { return 200 "Regex wins\n"; }
        location /test/images/  { return 200 "Longest standard prefix wins\n"; }

        # TODO (Activity 3.2): map /assets/media/ to www/media/ with alias
	location ^~ /assets/media/ {
		alias www/media/;
		autoindex off;
		location ~ /\. { deny all; }
	}
        # TODO (Activity 3.3): SPA fallback for /app/
	location /app/ {
		index index.html;
		try_files $uri $uri/ /app/index.html;
		add_header_inherit merge;
		add_header Cache-Control "no-cache";
	}
        # TODO (Activity 3.3): deny dotfiles, but leave /.well-known/ reachable
	location ~ /\.(?!well-known) {
		deny all;
		access_log off;
		log_not_found off;
	}
        # TODO (Activity 3.3): 301 redirect /legacy to /app/
	location = /legacy {
		return 301 /app/;
	}
    }
}

