# Sprint 1, Day 2 reference solution: Northwind static web tier
# Passes all 12 test_sprint01.sh assertions plus the stretch checks.
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  text/plain;
    access_log    logs/access.log;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    server_tokens off;                             # no version in Server header or error pages

    server {
        listen 8081;
        server_name shop.northwind.local;
        root www;

        add_header X-Worker-PID $pid always;

        location = /healthz { return 200 "OK\n"; }

        location / {
            index index.html;
        }

        # Static assets: ^~ skips regex evaluation, so the dotfile deny below
        # would NOT apply here. Nest the deny inside to keep it protected.
        location ^~ /assets/media/ {
            alias www/media/;                      # trailing slashes match on both sides
            autoindex off;
            location ~ /\. { deny all; }
        }

        # SPA: root (not alias) because the location matches the path's last part
        location /app/ {
            index index.html;
            try_files $uri $uri/ /app/index.html;
        }

        # Dotfiles: deny everything hidden except /.well-known/ (ACME, Sprint 3)
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        location = /legacy {
            return 301 /app/;
        }
    }
}

