# Sprint 3 Day 2: HTTP/2 and HTTP/3 on top of the Day 1 TLS edge
# Run from sprints/sprint-3/lab:  ngx -t && ngx -s reload   (the activities edit this file step by step)
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    # conn = connection serial, reqs = requests carried so far on that connection,
    # len = bytes the request took on the wire (after header compression, if any)
    log_format proto '"$request" $status proto=$server_protocol alpn=$ssl_alpn_protocol '
                     'conn=$connection reqs=$connection_requests len=$request_length rt=$request_time';
    access_log logs/access.log proto;

    # Day 1 result: TLS policy at http level, so every server on 8443 shares it
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 4h;

    upstream lumina_api_nodes {
        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
    }

    server {
        listen 8083;
        server_name lumina.local;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 8443 ssl;
        server_name lumina.local;

        ssl_certificate     certs/lumina-ecdsa.crt;
        ssl_certificate_key certs/lumina-ecdsa.key;
        ssl_certificate     certs/lumina-rsa.crt;
        ssl_certificate_key certs/lumina-rsa.key;

        location /api/ {
            proxy_pass http://lumina_api_nodes;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            default_type text/plain;
            return 200 "Lumina over $server_protocol\n";
        }
    }
}
