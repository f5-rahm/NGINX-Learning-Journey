# Sprint 3 reference solution: Lumina zero-trust edge (TLS 1.3, HTTP/2, HTTP/3, security headers)
# Run from sprints/sprint-3/lab:  ngx -t && ngx   (ngx helper from Sprint 1 Day 1)
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format edge '$remote_addr "$request" $status $server_protocol sni=$ssl_server_name '
                    '$ssl_protocol $ssl_cipher reused=$ssl_session_reused upstream=$upstream_addr';
    access_log logs/access.log edge;

    # TLS policy at http level. The session cache must be visible to the default
    # server of 8443, which handles resumption before SNI picks lumina.local.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 4h;

    # WebSocket: "Connection: upgrade" only when the client asked to upgrade.
    # '' '' (not '' close) keeps upstream keepalive working for plain requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream lumina_api_nodes {
        least_conn;
        server 127.0.0.1:8001 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8002 max_fails=2 fail_timeout=5s;
    }

    upstream lumina_chat_node {
        server 127.0.0.1:8003;
    }

    # Plain HTTP: everything moves to HTTPS
    server {
        listen 8083;
        server_name lumina.local;
        return 301 https://lumina.local:8443$request_uri;
    }

    # Unknown or missing SNI: refuse the handshake, on TCP and on QUIC
    server {
        listen 8443 ssl default_server;
        listen 8443 quic reuseport default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 8443 ssl;
        listen 8443 quic;
        http2 on;
        server_name lumina.local;

        ssl_certificate     certs/lumina-ecdsa.crt;
        ssl_certificate_key certs/lumina-ecdsa.key;
        ssl_certificate     certs/lumina-rsa.crt;
        ssl_certificate_key certs/lumina-rsa.key;

        # Every response, errors included. No location below sets add_header,
        # so all of them inherit this list.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Alt-Svc                   'h3=":8443"; ma=86400' always;

        # Backend implementation detail stays inside
        proxy_hide_header X-Handled-By;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","edge":"lumina-proxy"}\n';
        }

        location /api/v1/ {
            proxy_pass http://lumina_api_nodes;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503;
        }

        location /ws/chat {
            proxy_pass http://lumina_chat_node;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location / {
            root html;
            try_files $uri $uri/ /index.html;
        }
    }
}
