# Sprint 3 lab starter: Lumina zero-trust edge
# Copy to nginx.conf, complete the TODOs, then from sprints/sprint-3/lab:  ngx -t && ngx -s reload
# Requirements: ../README.md section 4. Certificates: ./make_certs.sh
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format edge '$remote_addr "$request" $status $server_protocol sni=$ssl_server_name '
                    '$ssl_protocol $ssl_cipher reused=$ssl_session_reused upstream=$upstream_addr';
    access_log logs/access.log edge;

    # TODO: TLS 1.2 and 1.3 only. TLS 1.2 limited to ECDHE key exchange with AEAD ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

    # TODO: Sessions resume, including after a reload.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 4h;

    # From Sprint 2: the API pool (8001, 8002) and the chat node (8003)
    upstream lumina_api_nodes {
        least_conn;
        server 127.0.0.1:8001 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8002 max_fails=2 fail_timeout=5s;
    }

    upstream lumina_chat_node {
        server 127.0.0.1:8003;
    }

    # TODO hide nginx version
    server_tokens off;

    # TODO: Port 8083 sends every request to https://lumina.local:8443 with the same path and query.
    # TODO: On 8443, handshakes for any name other than lumina.local, or with no name, are refused (TCP and QUIC).

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
	listen 8083;
	server_name lumina.local;
	return 301 https://lumina.local:8443$request_uri;
    }

    server {
	listen 8443 ssl default_server;
	listen 8443 quic reuseport default_server;
	ssl_reject_handshake on;
    }

    server {
        listen 8443 ssl;
	listen 8443 quic;
        server_name lumina.local;
        # TODO: HTTP/2, and HTTP/3 advertised to clients.
	http2 on;

        # TODO: Serve both certs/lumina-ecdsa.* and certs/lumina-rsa.*.
	ssl_certificate certs/lumina-ecdsa.crt;
	ssl_certificate_key certs/lumina-ecdsa.key;
	ssl_certificate certs/lumina-rsa.crt;
	ssl_certificate_key certs/lumina-rsa.key;

        # TODO: Every response, including errors, carries HSTS (max-age at least one year),
	add_header Strict-Transport-Security "max-age=31536000" always;
        #       X-Content-Type-Options: nosniff and X-Frame-Options: DENY.
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
        # TODO: Clients never see the NGINX version or the backend's X-Handled-By header.
	proxy_hide_header X-Handled-By;

	add_header Alt-Svc 'h3=":8443"; ma=86400' always;

        # TODO: From Sprint 2: /healthz, /api/v1/ (the backend learns the client used https),
        #       /ws/chat, and the SPA in html/.
        location /api/v1/ {
            proxy_pass http://lumina_api_nodes;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503;
        }

        location /ws/chat {
            proxy_pass http://lumina_chat_node;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location / {
            root html;
            try_files $uri $uri/ /index.html;
        }

	location /healthz {
	    access_log off;
	    default_type application/json;
	    return 200 '{"status":"healthy","edge":"lumina-proxy"}\n';
	}
    }
}
