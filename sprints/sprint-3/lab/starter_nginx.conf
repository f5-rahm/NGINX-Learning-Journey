# Sprint 3 lab starter: Lumina zero-trust edge
# Copy to nginx.conf, complete the TODOs, then from sprints/sprint-3/lab:  ngx -t && ngx -s reload
# Requirements: ../README.md section 4. Certificates: ./make_certs.sh
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format edge '$remote_addr "$request" $status $server_protocol sni=$ssl_server_name '
                    '$ssl_protocol $ssl_cipher reused=$ssl_session_reused upstream=$upstream_addr';
    access_log logs/access.log edge;

    # TODO: TLS 1.2 and 1.3 only. TLS 1.2 limited to ECDHE key exchange with AEAD ciphers.
    # TODO: Sessions resume, including after a reload.

    # From Sprint 2: the API pool (8001, 8002) and the chat node (8003)
    # TODO

    # TODO: Port 8083 sends every request to https://lumina.local:8443 with the same path and query.

    # TODO: On 8443, handshakes for any name other than lumina.local, or with no name, are refused (TCP and QUIC).

    server {
        listen 8443 ssl;
        server_name lumina.local;
        # TODO: HTTP/2, and HTTP/3 advertised to clients.

        # TODO: Serve both certs/lumina-ecdsa.* and certs/lumina-rsa.*.

        # TODO: Every response, including errors, carries HSTS (max-age at least one year),
        #       X-Content-Type-Options: nosniff and X-Frame-Options: DENY.
        # TODO: Clients never see the NGINX version or the backend's X-Handled-By header.

        # TODO: From Sprint 2: /healthz, /api/v1/ (the backend learns the client used https),
        #       /ws/chat, and the SPA in html/.
    }
}
