# Sprint 3 Day 1: TLS termination for Lumina
# Run from sprints/sprint-3/lab:  ngx -t && ngx   (the activities edit this file step by step)
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log info;      # handshake failures are only logged at info

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    # What each client negotiated
    log_format tls '$remote_addr "$request" $status sni=$ssl_server_name '
                   '$ssl_protocol $ssl_cipher kx=$ssl_curve reused=$ssl_session_reused';
    access_log logs/access.log tls;

    # Plain HTTP: send everyone to HTTPS
    server {
        listen 8083;
        server_name lumina.local;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name lumina.local;

        ssl_certificate     certs/lumina-ecdsa.crt;
        ssl_certificate_key certs/lumina-ecdsa.key;

        location / {
            default_type text/plain;
            return 200 "Lumina over $ssl_protocol with $ssl_cipher\n";
        }
    }
}
