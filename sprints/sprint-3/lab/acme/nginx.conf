# Sprint 3 Day 3 Enterprise Side Quest B: certificates issued automatically over ACME
# Run from sprints/sprint-3/lab/acme:  ngx -t && ngx   (a separate OSS instance, ports 8087/8447)
# Issuer: a local Pebble test CA (see day_03_enterprise.md), standing in for Let's Encrypt.
load_module /usr/lib/nginx/modules/ngx_http_acme_module.so;

user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log info;      # issuance and renewal are logged at info

events { worker_connections 1024; }

http {
    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    access_log logs/access.log;

    # The module looks up the ACME server's name itself
    resolver 127.0.0.53;

    acme_issuer pebble {
        uri https://localhost:14000/dir;
        ssl_trusted_certificate /srv/nginx-journey/sprints/sprint-3/lab/acme/pebble/pebble.minica.pem;
        # Absolute path: a relative one lands under the package's /var/cache/nginx
        state_path /srv/nginx-journey/sprints/sprint-3/lab/acme/state;
        accept_terms_of_service;
    }
    acme_shared_zone zone=acme_shared:1M;

    # HTTP-01 challenges arrive here. Everything else is redirected to HTTPS.
    server {
        listen 8087;
        server_name lumina.local;
        return 301 https://lumina.local:8447$request_uri;
    }

    server {
        listen 8447 ssl;
        server_name lumina.local;

        acme_certificate pebble;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        default_type text/plain;
        return 200 "Lumina with an ACME certificate over $ssl_protocol\n";
    }
}
