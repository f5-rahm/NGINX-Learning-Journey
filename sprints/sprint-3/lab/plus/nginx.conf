# Sprint 3 Day 3 Enterprise Side Quest A: certificates from the key-value store
# Mounted into the container as /etc/nginx/nginx.conf (see day_03_enterprise.md).
# Licensing (R33+) uses the defaults: /etc/nginx/license.jwt, usage reports to product.connect.nginx.com.
user  nginx;
worker_processes  2;
error_log  stderr notice;            # docker logs lumina-tls-plus
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    log_format tls '"$request" $status sni=$ssl_server_name $ssl_protocol';
    access_log /dev/stdout tls;

    # Certificates live in shared memory, written through the API, persisted to a state file.
    # One key per hostname. Its value is the private key and certificate as ONE PEM bundle,
    # so a rotation is a single API write (the API changes one key per PATCH).
    keyval_zone zone=lumina_certs:1m state=/var/lib/nginx/state/lumina_certs.json;
    keyval $ssl_server_name $lumina_pem zone=lumina_certs;

    server {
        listen 8444 ssl;
        server_name lumina.local;

        # "data:" means the value is the PEM itself, not a file path.
        # Loaded per handshake from whatever the store holds right now.
        ssl_certificate     data:$lumina_pem;
        ssl_certificate_key data:$lumina_pem;

        default_type text/plain;
        return 200 "Lumina (NGINX Plus) over $ssl_protocol\n";
    }

    # Management: API (write access) and dashboard, loopback only
    server {
        listen 127.0.0.1:8085;
        location /api/ {
            api write=on;
        }
        location = /dashboard.html {
            root /usr/share/nginx/html;
        }
    }
}
