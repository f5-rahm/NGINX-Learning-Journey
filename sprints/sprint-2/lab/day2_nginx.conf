# Sprint 2 Day 2: upstream pools, balancing algorithms & connection reuse
# cp day2_nginx.conf nginx.conf && ngx -t && ngx
user  nginx;
worker_processes  2;          # two workers matter today: each keeps its own counters
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format upstream_log '$remote_addr "$request" $status '
                            'upstream=$upstream_addr ustatus=$upstream_status';
    access_log logs/access.log upstream_log;

    # Activity 3.1: round-robin, then weights
    upstream rr_pool       { server 127.0.0.1:8001; server 127.0.0.1:8002; }
    upstream weighted_pool { server 127.0.0.1:8001 weight=3; server 127.0.0.1:8002; }

    # Activity 3.2: client-IP stickiness
    upstream sticky_pool   { ip_hash; server 127.0.0.1:8001; server 127.0.0.1:8002; }

    # Activity 3.3: least_conn, without and with a shared-memory zone
    upstream lc_pool       { least_conn; server 127.0.0.1:8001; server 127.0.0.1:8002; }
    upstream lc_zone_pool  { zone lc_zone_pool 64k; least_conn;
                             server 127.0.0.1:8001; server 127.0.0.1:8002; }

    # Activity 3.4: key hashing (you'll add 127.0.0.1:8004 to both)
    upstream ring_pool     { hash $request_uri consistent; server 127.0.0.1:8001; server 127.0.0.1:8002; }
    upstream modulo_pool   { hash $request_uri;            server 127.0.0.1:8001; server 127.0.0.1:8002; }

    # Activity 3.5: standby capacity
    upstream backup_pool   { server 127.0.0.1:8001; server 127.0.0.1:8002;
                             server 127.0.0.1:8004 backup; }

    server {
        listen 8082;
        server_name lumina.local;

        location /rr/       { proxy_pass http://rr_pool; }
        location /weighted/ { proxy_pass http://weighted_pool; }
        location /sticky/   { proxy_pass http://sticky_pool; }
        location /lc/       { proxy_pass http://lc_pool; }
        location /lcz/      { proxy_pass http://lc_zone_pool; }
        location /ring/     { proxy_pass http://ring_pool; }
        location /modulo/   { proxy_pass http://modulo_pool; }
        location /backup/   { proxy_pass http://backup_pool; }

        # Activity 3.6: the same pool with upstream keepalive defeated
        location /no-reuse/ { proxy_pass http://rr_pool; proxy_http_version 1.0; }
    }
}
