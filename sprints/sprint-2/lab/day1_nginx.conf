# Sprint 2 Day 1: how proxy_pass builds the request
# cp day1_nginx.conf nginx.conf && ngx -t && ngx
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format upstream_log '$remote_addr "$request" $status '
                            'upstream=$upstream_addr ustatus=$upstream_status';
    access_log logs/access.log upstream_log;

    upstream lumina_api_nodes {
        server 127.0.0.1:8001;
    }

    server {
        listen 8082;
        server_name lumina.local;

        # --- Activity 3.1: URI mapping drill (all point at api-node-1) ---
        location /a/          { proxy_pass http://127.0.0.1:8001; }
        location /b/          { proxy_pass http://127.0.0.1:8001/; }
        location /c           { proxy_pass http://127.0.0.1:8001/; }
        location /d/          { proxy_pass http://127.0.0.1:8001/v2; }
        location /e/          { proxy_pass http://127.0.0.1:8001/v2/; }
        location ~ ^/f/(.*)$  { proxy_pass http://127.0.0.1:8001/$1; }
        location /g/          { set $be 127.0.0.1:8001; proxy_pass http://$be/; }
        location /h/          { set $be 127.0.0.1:8001; rewrite ^/h/(.*)$ /$1 break; proxy_pass http://$be; }

        # --- Activities 3.2-3.4: header forwarding ---
        location /api/ {
            proxy_pass http://lumina_api_nodes;
        }
    }
}
