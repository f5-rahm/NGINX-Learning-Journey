# Sprint 2 Day 4: NGINX Plus with a runtime-managed upstream
# Mounted into the container as /etc/nginx/nginx.conf (see day_04.md).
# The container uses host networking, so 127.0.0.1:800x reaches the mock backends.
user  nginx;
worker_processes  2;
error_log  stderr notice;            # docker logs lumina-plus
pid        /var/run/nginx.pid;

# Licensing (R33+): defaults are license_token /etc/nginx/license.jwt and
# usage_report endpoint=product.connect.nginx.com. With enforce_initial_report on
# (the default), traffic is refused until the first usage report succeeds.

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format upstream_log '$remote_addr "$request" $status '
                            'up=[$upstream_addr] ust=[$upstream_status]';
    access_log /dev/stdout upstream_log;

    upstream lumina_api_nodes {
        zone lumina_api_nodes 256k;      # required for the API: state lives in shared memory
        least_conn;
        # Membership is managed through the API and persisted here.
        # "state" cannot be combined with "server" lines.
        state /var/lib/nginx/state/lumina_api_nodes.state;
    }

    server {
        listen 8084;
        server_name lumina.local;

        location /api/v1/ {
            proxy_pass http://lumina_api_nodes;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }

    # Management plane: loopback only
    server {
        listen 127.0.0.1:8085;

        location /api/ {
            api write=on;
        }
        location = /dashboard.html {
            root /usr/share/nginx/html;
        }
    }
}
