# Sprint 2 lab starter: Lumina multi-service gateway
# Copy to nginx.conf, fill in the TODOs, then from sprints/sprint-2/lab:  ngx -t && ngx
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format upstream_log '$remote_addr "$request" $status '
                            'upstream=$upstream_addr ustatus=$upstream_status '
                            'urt=$upstream_response_time rt=$request_time';
    access_log logs/access.log upstream_log;

    # TODO: map $http_upgrade -> $connection_upgrade

    # TODO: upstream lumina_api_nodes: least_conn, 127.0.0.1:8001 and :8002,
    #       max_fails=2 fail_timeout=5s, keepalive pool

    # TODO: upstream lumina_chat_node: 127.0.0.1:8003

    server {
        listen 8082;
        server_name lumina.local localhost;

        # TODO: /healthz returns 200 JSON from NGINX itself, with "status": "healthy"

        # TODO: /api/v1/ -> lumina_api_nodes, URI passed verbatim,
        #       Host / X-Real-IP / X-Forwarded-For / X-Forwarded-Proto,
        #       keepalive headers, timeouts, proxy_next_upstream

        # TODO: /ws/chat -> lumina_chat_node with WebSocket upgrade headers,
        #       proxy_read_timeout 3600s

        # TODO: / serves html/ with SPA fallback to /index.html
    }
}
