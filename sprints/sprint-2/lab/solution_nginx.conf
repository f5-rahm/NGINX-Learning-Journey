# Sprint 2 reference solution: Lumina multi-service gateway
# Run from sprints/sprint-2/lab:  ngx -t && ngx   (ngx helper from Sprint 1 Day 1)
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    # $upstream_addr lists every server tried, so retries are visible in the log
    log_format upstream_log '$remote_addr "$request" $status '
                            'upstream=$upstream_addr ustatus=$upstream_status '
                            'urt=$upstream_response_time rt=$request_time';
    access_log logs/access.log upstream_log;

    # WebSocket: send "Connection: upgrade" only when the client asked to upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream lumina_api_nodes {
        least_conn;
        server 127.0.0.1:8001 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8002 max_fails=2 fail_timeout=5s;
        keepalive 16;   # on by default since 1.29.7; explicit for older builds
    }

    upstream lumina_chat_node {
        server 127.0.0.1:8003;
    }

    server {
        listen 8082;
        server_name lumina.local localhost;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","edge":"lumina-proxy"}\n';
        }

        # Core API: no URI on proxy_pass, so /api/v1/... reaches the backend verbatim
        location /api/v1/ {
            proxy_pass http://lumina_api_nodes;

            # Classic keepalive recipe. Both lines are the defaults since 1.29.7,
            # but older builds (and most distro packages) still need them.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_read_timeout    15s;
            proxy_next_upstream   error timeout http_502 http_503;
            proxy_next_upstream_tries   2;
            proxy_next_upstream_timeout 5s;
        }

        # AI chat WebSocket relay. This location sets its own proxy_set_header
        # list, so every header it needs is declared here (nothing is inherited).
        location /ws/chat {
            proxy_pass http://lumina_chat_node;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host            $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        location / {
            root html;
            try_files $uri $uri/ /index.html;
        }
    }
}
