# Sprint 2 Day 3: failure handling, retries & WebSockets
# cp day3_nginx.conf nginx.conf && ngx -t && ngx -s reload
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    # Every server tried, each attempt's status and time, and the total time
    log_format upstream_log '$request_method $request_uri $status '
                            'up=[$upstream_addr] ust=[$upstream_status] '
                            'urt=[$upstream_response_time] rt=$request_time';
    access_log logs/access.log upstream_log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Activity 3.1: passive health checks, per-worker vs shared accounting
    upstream api_pool {
        server 127.0.0.1:8001 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8002 max_fails=2 fail_timeout=5s;
    }
    upstream api_zone_pool {
        zone api_zone_pool 64k;
        server 127.0.0.1:8001 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8002 max_fails=2 fail_timeout=5s;
    }

    # Activities 3.2-3.4: failure accounting off, so experiments don't mark nodes down
    upstream retry_pool {
        server 127.0.0.1:8001 max_fails=0;
        server 127.0.0.1:8002 max_fails=0;
    }

    server {
        listen 8082;
        server_name lumina.local;

        proxy_next_upstream error timeout http_502 http_503;

        location /api/  { proxy_pass http://api_pool; }
        location /apiz/ { proxy_pass http://api_zone_pool; }

        location /retry/ {
            proxy_pass http://retry_pool;
            proxy_connect_timeout 2s;
            proxy_read_timeout    3s;
        }

        # Activity 3.5: WebSocket relay with a deliberately short idle timeout
        location /ws/chat {
            proxy_pass http://127.0.0.1:8003;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 5s;
        }

        # ...and one that forgets the upgrade headers
        location /ws/broken {
            proxy_pass http://127.0.0.1:8003;
        }
    }
}
