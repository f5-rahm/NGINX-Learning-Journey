# Sprint 7 side quest start: NGINX Plus in front of Tidewater's dispatch API and staff portal.
#   :8094  /api/     the dispatch API (bearer tokens from Keycloak)  -> the portal app
#          /portal/  the staff portal (sign-in through Keycloak)       -> the portal app
#   127.0.0.1:8085   the NGINX Plus API and dashboard
# Keycloak is the same realm as the main lab: its front door is the OSS edge on https://localhost:8091,
# its back channel is http://10.57.0.30:8080.
user nginx;
worker_processes 2;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

# The license is in /etc/nginx; this config runs with -c /lab/plus/nginx.conf
mgmt {
    license_token /etc/nginx/license.jwt;
    state_path    /var/lib/nginx/state;
}

http {
    default_type application/octet-stream;
    log_format plus '$remote_addr "$request" $status';
    access_log /dev/stdout plus;

    resolver 127.0.0.11 valid=30s;

    upstream portal { zone portal 64k; server 10.57.0.20:9003; }

    server {
        listen 8094 ssl;
        server_name localhost;
        ssl_certificate     /lab/certs/edge.crt;
        ssl_certificate_key /lab/certs/edge.key;

        location /api/ {
            proxy_pass http://portal;
        }

        location /portal/ {
            proxy_pass http://portal;
        }
    }

    server {
        listen 8085;
        location /api/ {
            api write=on;
        }
        location / {
            root /usr/share/nginx/html;
            index dashboard.html;
        }
    }
}
