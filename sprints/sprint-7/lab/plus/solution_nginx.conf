# Sprint 7 side quest, reference answer: NGINX Plus in front of Tidewater's dispatch API and staff portal.
#   :8094  /api/     the dispatch API (bearer tokens from Keycloak)  -> the portal app
#          /portal/  the staff portal (sign-in through Keycloak)       -> the portal app
#   127.0.0.1:8085   the NGINX Plus API and dashboard
# Keycloak is the same realm as the main lab: its front door is the OSS edge on https://localhost:8091,
# its back channel is http://10.57.0.30:8080.
user nginx;
worker_processes 2;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

# The license is in /etc/nginx; this config runs with -c /lab/plus/nginx.conf
mgmt {
    license_token /etc/nginx/license.jwt;
    state_path    /var/lib/nginx/state;
}

http {
    default_type application/octet-stream;
    log_format plus '$remote_addr "$request" $status';
    access_log /dev/stdout plus;

    resolver 127.0.0.11 valid=30s;

    upstream portal { zone portal 64k; server 10.57.0.20:9003; }

    # ---- bearer tokens for the dispatch API, checked locally with Keycloak's public keys
    auth_jwt_claim_set $jwt_groups groups;          # an array claim: $jwt_claim_groups would be empty

    map $jwt_claim_iss $jwt_issuer_ok {
        "https://localhost:8091/realms/tidewater" 1;
        default                                    0;
    }
    map $jwt_claim_aud $jwt_audience_ok {           # Keycloak sends aud as a string or an array
        "~(^|,)dispatch-api(,|$)" 1;
        default                   0;
    }
    map $jwt_groups $jwt_is_admin {
        "~(^|,)admins(,|$)" 1;
        default             0;
    }

    # ---- single sign-on for the portal, native in NGINX Plus
    oidc_provider tidewater {
        issuer        https://localhost:8091/realms/tidewater;
        config_url    http://10.57.0.30:8080/realms/tidewater/.well-known/openid-configuration;
        client_id     plus-portal;
        client_secret plus-lab-secret;
    }

    server {
        listen 8094 ssl;
        server_name localhost;
        ssl_certificate     /lab/certs/edge.crt;
        ssl_certificate_key /lab/certs/edge.key;

        location /api/ {
            auth_jwt             "dispatch";
            auth_jwt_type        signed;
            auth_jwt_key_request /_jwks;
            auth_jwt_key_cache   10m;
            auth_jwt_require     $jwt_issuer_ok $jwt_audience_ok;
            proxy_set_header X-User   $jwt_claim_preferred_username;
            proxy_set_header X-Groups $jwt_groups;
            proxy_set_header Authorization "";
            proxy_pass http://portal;
        }

        location /api/admin/ {
            auth_jwt             "dispatch";
            auth_jwt_type        signed;
            auth_jwt_key_request /_jwks;
            auth_jwt_key_cache   10m;
            auth_jwt_require     $jwt_issuer_ok $jwt_audience_ok;
            auth_jwt_require     $jwt_is_admin error=403;
            proxy_set_header X-User   $jwt_claim_preferred_username;
            proxy_set_header X-Groups $jwt_groups;
            proxy_set_header Authorization "";
            proxy_pass http://portal;
        }

        location = /_jwks {
            internal;
            proxy_pass http://10.57.0.30:8080/realms/tidewater/protocol/openid-connect/certs;
        }

        # Keycloak sends the browser back here (the provider's default redirect_uri): it must be
        # a location where auth_oidc is on, or NGINX serves it like any other URI
        location = /oidc_callback {
            auth_oidc tidewater;
        }

        location /portal/ {
            auth_oidc tidewater;
            proxy_set_header X-User   $oidc_claim_preferred_username;
            proxy_set_header X-Email  $oidc_claim_email;
            proxy_set_header X-Groups $oidc_claim_groups;
            proxy_set_header Cookie   "";
            proxy_pass http://portal;
        }
    }

    server {
        listen 8085;
        location /api/ {
            api write=on;
        }
        location / {
            root /usr/share/nginx/html;
            index dashboard.html;
        }
    }
}
