# Sprint 7 Day 2 start (= Day 1's end): the Tidewater Logistics edge. Today: auth_request for the ops tool.
#   :8091  staff portal (/portal/, single sign-on), ops tool (/ops/, auth_request), the IdP's front door
#   :8092  partner API (mutual TLS), and /ledger/ (mutual TLS to the upstream too)
worker_processes 2;
pid temp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format edge '$remote_addr "$request" $status ssl_verify=$ssl_client_verify partner="$partner"';
    access_log logs/access.log edge;

    upstream partners { server 10.57.0.20:9001; }
    upstream ops      { server 10.57.0.20:9002; }
    upstream portal   { server 10.57.0.20:9003; }
    upstream authz    { server 10.57.0.20:9100; }
    upstream ledger   { server 10.57.0.20:9443; }
    upstream idp      { server 10.57.0.30:8080; }
    upstream sso      { server 10.57.0.40:4180; }

    ssl_certificate     certs/edge.crt;
    ssl_certificate_key certs/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The partner's name: the CN of a certificate that passed verification, never of one that didn't
    map $ssl_client_s_dn $cert_cn {
        "~(^|,)CN=(?<cn>[^,]+)" $cn;
        default                 "";
    }
    map $ssl_client_verify $partner {
        SUCCESS $cert_cn;
        default "";
    }


    # ---------------------------------------------------------------- partner API (mTLS)
    server {
        listen 8092 ssl;
        server_name localhost;

        ssl_client_certificate certs/partner-ca.crt;
        ssl_crl                certs/partner-ca.crl;
        ssl_verify_client      on;
        ssl_verify_depth       1;

        error_page 495 = @cert_rejected;
        error_page 496 = @cert_missing;

        location @cert_missing {
            default_type application/json;
            return 401 '{"error": "client certificate required"}\n';
        }
        location @cert_rejected {
            default_type application/json;
            return 403 '{"error": "client certificate rejected"}\n';
        }

        location / {
            proxy_set_header X-Partner        $partner;
            proxy_set_header X-Partner-DN     $ssl_client_s_dn;
            proxy_set_header X-Partner-Verify $ssl_client_verify;
            proxy_set_header X-Partner-Cert   $ssl_client_escaped_cert;
            proxy_pass http://partners;
        }

        # The ledger only talks to clients with a certificate from the internal CA, and the edge
        # only talks to the real ledger
        location /ledger/ {
            proxy_set_header X-Partner $partner;
            proxy_pass https://ledger;
            proxy_ssl_certificate         certs/edge-client.crt;
            proxy_ssl_certificate_key     certs/edge-client.key;
            proxy_ssl_trusted_certificate certs/internal-ca.crt;
            proxy_ssl_verify              on;
            proxy_ssl_name                ledger.internal;
            proxy_ssl_server_name         on;
        }
    }

    # ---------------------------------------------------------------- portal, ops tool, IdP front door
    server {
        listen 8091 ssl;
        server_name localhost;

        # Keycloak's public face. Only what a browser needs: no admin console here.
        location /realms/ {
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_pass http://idp;
        }
        location /resources/ {
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_pass http://idp;
        }

        location /ops/ {
            proxy_pass http://ops;
        }

        location /portal/ {
            proxy_pass http://portal;
        }

        location / {
            default_type text/plain;
            return 200 "Tidewater Logistics: /portal/ for staff, /ops/ for operations\n";
        }
    }
}
