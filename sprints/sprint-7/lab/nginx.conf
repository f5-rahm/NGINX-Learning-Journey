# Sprint 7 Day 1 start: the Tidewater Logistics edge. Today: mutual TLS on the partner API (:8092).
#   :8092  partner API, and /ledger/
#   :8091  staff portal (/portal/), ops tool (/ops/), the IdP's front door (/realms/, /resources/)
worker_processes 2;
pid temp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format edge '$remote_addr "$request" $status ssl_verify=$ssl_client_verify';
    access_log logs/access.log edge;

    upstream partners { server 10.57.0.20:9001; }
    upstream ops      { server 10.57.0.20:9002; }
    upstream portal   { server 10.57.0.20:9003; }
    upstream authz    { server 10.57.0.20:9100; }   # GET /check
    upstream ledger   { server 10.57.0.20:9443; }   # HTTPS only
    upstream idp      { server 10.57.0.30:8080; }   # Keycloak
    upstream sso      { server 10.57.0.40:4180; }   # OAuth2 Proxy

    ssl_certificate     certs/edge.crt;
    ssl_certificate_key certs/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---------------------------------------------------------------- partner API
    server {
        listen 8092 ssl;
        server_name localhost;

        location / {
            proxy_pass http://partners;
        }

        location /ledger/ {
            proxy_pass https://ledger;
        }
    }

    # ---------------------------------------------------------------- portal, ops tool, IdP front door
    server {
        listen 8091 ssl;
        server_name localhost;

        # Keycloak's public face: the login pages a browser needs
        location /realms/ {
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_pass http://idp;
        }
        location /resources/ {
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_pass http://idp;
        }

        location /ops/ {
            proxy_pass http://ops;
        }

        location /portal/ {
            proxy_pass http://portal;
        }

        location / {
            default_type text/plain;
            return 200 "Tidewater Logistics: /portal/ for staff, /ops/ for operations\n";
        }
    }
}
