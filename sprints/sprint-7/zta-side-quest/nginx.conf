events {}
http {
    log_format x '$request $status auth=$upstream_status';
    access_log /dev/stdout x;
    error_log /dev/stderr info;
    upstream sso    { server 10.89.0.40:4180; }
    upstream idp    { server 10.89.0.30:8080; }
    upstream portal { server 10.89.0.20:9003; }
    server {
        listen 8088;
        location /realms/    { proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto http; proxy_set_header X-Forwarded-Port 8088; proxy_pass http://idp; }
        location /resources/ { proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto http; proxy_set_header X-Forwarded-Port 8088; proxy_pass http://idp; }
        location /oauth2/ { proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto http; proxy_pass http://sso; proxy_buffer_size 16k; proxy_buffers 8 16k; }
        location = /oauth2/auth {
            internal;
            proxy_pass http://sso;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_buffer_size 16k; proxy_buffers 8 16k;
        }
        # debug only: show the auth endpoint's response headers to the client
        location = /debug/auth {
            proxy_pass http://sso/oauth2/auth;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_buffer_size 16k; proxy_buffers 8 16k;
        }
        location /portal/ {
            auth_request /oauth2/auth;
            error_page 401 = @login;
            auth_request_set $sso_user $upstream_http_x_auth_request_preferred_username;
            auth_request_set $sso_id   $upstream_http_authorization;
            auth_request_set $sso_at   $upstream_http_x_auth_request_access_token;
            proxy_set_header X-User        $sso_user;
            proxy_set_header X-Id-Token    $sso_id;
            proxy_set_header Authorization "Bearer $sso_at";
            proxy_set_header Cookie "";
            auth_request_set $sso_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $sso_cookie;
            proxy_pass http://portal;
        }
        location @login { return 302 /oauth2/start?rd=$request_uri; }
    }
}
