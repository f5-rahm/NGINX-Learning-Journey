<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="966" viewBox="0 0 1200 966" font-family="Lato" xml:space="preserve">
<defs><marker id="ar-6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="ar-B91C1C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="ar-15803D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs>
<rect x="0" y="0" width="1200" height="966" fill="#FFFFFF"/>
<text x="24" y="46" font-size="28" fill="#1F1F1F" text-anchor="start" font-weight="bold">NGINX checks the certificate at the desk, not the door</text>
<text x="24" y="78" font-size="15.5" fill="#555555" text-anchor="start">Sprint 7 Day 1, mutual TLS. NGINX lets every client-certificate handshake finish, then judges the certificate when</text>
<text x="24" y="99" font-size="15.5" fill="#555555" text-anchor="start">the HTTP request arrives. BIG-IP&#x27;s Client SSL &quot;require&quot; turns the client away inside the handshake.</text>
<rect x="16" y="202" width="776" height="118" rx="10" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="24" y="220" font-size="13" fill="#6B7280" text-anchor="start" font-weight="bold">TLS handshake</text>
<rect x="800" y="202" width="384" height="118" rx="10" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="808" y="220" font-size="13" fill="#6B7280" text-anchor="start" font-weight="bold">HTTP</text>
<rect x="24" y="232" width="172" height="62" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
<text x="110.0" y="259" font-size="15" fill="#1F1F1F" text-anchor="middle" font-weight="bold">ClientHello</text>
<line x1="198" y1="263" x2="217" y2="263" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar-6B7280)"/>
<rect x="220" y="232" width="172" height="62" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
<text x="306.0" y="259" font-size="15" fill="#1F1F1F" text-anchor="middle" font-weight="bold">CertificateRequest</text>
<text x="306.0" y="279" font-size="13" fill="#555555" text-anchor="middle">CA names offered</text>
<line x1="394" y1="263" x2="413" y2="263" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar-6B7280)"/>
<rect x="416" y="232" width="172" height="62" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
<text x="502.0" y="259" font-size="15" fill="#1F1F1F" text-anchor="middle" font-weight="bold">Certificate +</text>
<text x="502.0" y="279" font-size="13" fill="#555555" text-anchor="middle">CertificateVerify</text>
<line x1="590" y1="263" x2="609" y2="263" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar-6B7280)"/>
<rect x="612" y="232" width="172" height="62" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
<text x="698.0" y="259" font-size="15" fill="#1F1F1F" text-anchor="middle" font-weight="bold">Finished</text>
<text x="698.0" y="279" font-size="13" fill="#555555" text-anchor="middle">handshake done</text>
<line x1="786" y1="263" x2="805" y2="263" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar-6B7280)"/>
<rect x="808" y="232" width="172" height="62" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
<text x="894.0" y="259" font-size="15" fill="#1F1F1F" text-anchor="middle" font-weight="bold">HTTP request</text>
<text x="894.0" y="279" font-size="13" fill="#555555" text-anchor="middle">headers read</text>
<line x1="982" y1="263" x2="1001" y2="263" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar-6B7280)"/>
<rect x="1004" y="232" width="172" height="62" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
<text x="1090.0" y="259" font-size="15" fill="#1F1F1F" text-anchor="middle" font-weight="bold">Verdict</text>
<text x="1090.0" y="279" font-size="13" fill="#555555" text-anchor="middle" font-family="DejaVu Sans Mono">$ssl_client_verify</text>
<rect x="300" y="122" width="600" height="64" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
<text x="316" y="146" font-size="15.5" fill="#B91C1C" text-anchor="start" font-weight="bold">BIG-IP Client SSL &quot;require&quot; refuses here</text>
<text x="316" y="169" font-size="14" fill="#1F1F1F" text-anchor="start">A fatal TLS alert. No HTTP response, nothing in the access log.</text>
<line x1="502.0" y1="186" x2="502.0" y2="230" stroke="#B91C1C" stroke-width="2" marker-end="url(#ar-B91C1C)"/>
<rect x="540" y="334" width="636" height="86" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
<text x="556" y="358" font-size="15.5" fill="#15803D" text-anchor="start" font-weight="bold">NGINX ssl_verify_client on refuses here, before any location</text>
<text x="556" y="381" font-size="14" fill="#1F1F1F" text-anchor="start">A 400 by default, or your own 401/403 JSON or HTML via error_page 495/496.</text>
<text x="556" y="402" font-size="14" fill="#1F1F1F" text-anchor="start">The refusal is in the access log, with the reason.</text>
<line x1="1090.0" y1="334" x2="1090.0" y2="296" stroke="#15803D" stroke-width="2" marker-end="url(#ar-15803D)"/>
<text x="24" y="360" font-size="15" fill="#1F1F1F" text-anchor="start" font-weight="bold">Same certificate checks, different</text>
<text x="24" y="381" font-size="15" fill="#1F1F1F" text-anchor="start" font-weight="bold">place to say no. No iRule needed</text>
<text x="24" y="402" font-size="15" fill="#1F1F1F" text-anchor="start" font-weight="bold">to turn a failure into a readable answer.</text>
<text x="24" y="466" font-size="20" fill="#1F1F1F" text-anchor="start" font-weight="bold">Five more things the day taught me</text>
<rect x="24" y="486" width="1152" height="78" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
<rect x="24" y="486" width="8" height="78" rx="3" fill="#1D4ED8"/>
<text x="46" y="516" font-size="16" fill="#1D4ED8" text-anchor="start" font-weight="bold">The key is the secret</text>
<text x="46" y="540" font-size="13" fill="#555555" text-anchor="start" font-style="italic">Where: Stage 3</text>
<text x="400" y="518" font-size="14.2" fill="#1F1F1F" text-anchor="start">A certificate is public. CertificateVerify is a signature only the private key can make,</text>
<text x="400" y="541" font-size="14.2" fill="#1F1F1F" text-anchor="start">so a copied .crt gets nowhere on its own. You revoke when a key leaks, not a certificate.</text>
<rect x="24" y="576" width="1152" height="78" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="1.5"/>
<rect x="24" y="576" width="8" height="78" rx="3" fill="#B45309"/>
<text x="46" y="606" font-size="16" fill="#B45309" text-anchor="start" font-weight="bold">optional_no_ca hands the verdict to you</text>
<text x="46" y="630" font-size="13" fill="#555555" text-anchor="start" font-style="italic">Where: Verdict</text>
<text x="400" y="608" font-size="14.2" fill="#1F1F1F" text-anchor="start">A rogue-CA forgery was served with FAILED:..., and its CN and SPIFFE ID still reached the app.</text>
<text x="400" y="631" font-size="14.2" fill="#1F1F1F" text-anchor="start">Derive the identity only when $ssl_client_verify is SUCCESS: then the forgery&#x27;s name is empty.</text>
<rect x="24" y="666" width="1152" height="78" rx="8" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5"/>
<rect x="24" y="666" width="8" height="78" rx="3" fill="#6D28D9"/>
<text x="46" y="696" font-size="16" fill="#6D28D9" text-anchor="start" font-weight="bold">The CRL is read when the config loads</text>
<text x="46" y="720" font-size="13" fill="#555555" text-anchor="start" font-style="italic">Where: Before stage 1</text>
<text x="400" y="698" font-size="14.2" fill="#1F1F1F" text-anchor="start">Revoked Globex kept getting 200 until the reload, on NGINX Plus too. Reloads are graceful;</text>
<text x="400" y="721" font-size="14.2" fill="#1F1F1F" text-anchor="start">ssl_ocsp checks live instead, with a responder in the path of every new connection.</text>
<rect x="24" y="756" width="1152" height="78" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
<rect x="24" y="756" width="8" height="78" rx="3" fill="#B91C1C"/>
<text x="46" y="786" font-size="16" fill="#B91C1C" text-anchor="start" font-weight="bold">One expired CRL locks out every partner</text>
<text x="46" y="810" font-size="13" fill="#555555" text-anchor="start" font-style="italic">Where: Verdict</text>
<text x="400" y="788" font-size="14.2" fill="#1F1F1F" text-anchor="start">A CRL valid for 15 seconds ran out, and Acme, Globex and Initech all got 403 &quot;CRL has expired&quot;.</text>
<text x="400" y="811" font-size="14.2" fill="#1F1F1F" text-anchor="start">The CRL renewal job is now part of the partner API&#x27;s uptime.</text>
<rect x="24" y="846" width="1152" height="78" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
<rect x="24" y="846" width="8" height="78" rx="3" fill="#4B5563"/>
<text x="46" y="876" font-size="16" fill="#4B5563" text-anchor="start" font-weight="bold">A custom error page&#x27;s CSS is refused too</text>
<text x="46" y="900" font-size="13" fill="#555555" text-anchor="start" font-style="italic">Where: Verdict, again</text>
<text x="400" y="878" font-size="14.2" fill="#1F1F1F" text-anchor="start">The browser&#x27;s request for style.css arrives without a certificate and gets the error page back.</text>
<text x="400" y="901" font-size="14.2" fill="#1F1F1F" text-anchor="start">A location can&#x27;t exempt it. Inline the CSS and JS, or serve them from an origin without mTLS.</text>
<text x="24" y="952" font-size="12.5" fill="#6B7280" text-anchor="start">Measured in the lab on nginx 1.31.6 / OpenSSL 3.5.7 and NGINX Plus R37.1.   #NGINX #mTLS #F5 #LearningInPublic</text>
</svg>
