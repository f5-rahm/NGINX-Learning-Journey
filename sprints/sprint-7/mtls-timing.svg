<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="844" viewBox="0 0 1200 844" font-family="Lato" xml:space="preserve">
<rect x="0" y="0" width="1200" height="844" fill="#FFFFFF"/>
<text x="24" y="46" font-size="28" fill="#1F1F1F" text-anchor="start" font-weight="bold">When NGINX reads, checks and decides</text>
<text x="24" y="78" font-size="15.5" fill="#555555" text-anchor="start">Sprint 7 Day 1, mutual TLS. The PKI is standard; the nuance is in timing. Four moments, what NGINX does</text>
<text x="24" y="99" font-size="15.5" fill="#555555" text-anchor="start">at each one by default, and where it caught me out. Measured on nginx 1.31.6 and NGINX Plus R37.1.</text>
<rect x="24" y="116" width="72" height="22" rx="5" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.2"/>
<text x="60" y="132" font-size="11.5" fill="#1D4ED8" text-anchor="middle" font-weight="bold">DEFAULT</text>
<rect x="108" y="116" width="72" height="22" rx="5" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.2"/>
<text x="144" y="132" font-size="11.5" fill="#B91C1C" text-anchor="middle" font-weight="bold">TRAP</text>
<rect x="192" y="116" width="72" height="22" rx="5" fill="#F0FDF4" stroke="#15803D" stroke-width="1.2"/>
<text x="228" y="132" font-size="11.5" fill="#15803D" text-anchor="middle" font-weight="bold">SET IT</text>
<text x="280" y="132" font-size="13" fill="#555555" text-anchor="start">what NGINX does  ·  where it bites  ·  what to configure</text>
<rect x="24" y="160" width="276" height="58" rx="8" fill="#1F2937" stroke="#1F2937" stroke-width="1.5"/>
<text x="38" y="186" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="bold">1  Config load</text>
<text x="38" y="206" font-size="12.5" fill="#D1D5DB" text-anchor="start">nginx -t / reload</text>
<path d="M302,180 L314,189 L302,198 z" fill="#9CA3AF"/>
<rect x="24" y="230" width="276" height="128" rx="7" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.3"/>
<rect x="36" y="241" width="65.19999999999999" height="18" rx="4" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1"/>
<text x="42" y="254" font-size="10.5" fill="#1D4ED8" text-anchor="start" font-weight="bold">DEFAULT</text>
<text x="36" y="276" font-size="14.2" fill="#1D4ED8" text-anchor="start" font-weight="bold">The CRL is read once</text>
<text x="36" y="296" font-size="12.8" fill="#1F1F1F" text-anchor="start">ssl_crl is loaded with the config and</text>
<text x="36" y="314" font-size="12.8" fill="#1F1F1F" text-anchor="start">takes no variables. NGINX Plus is the</text>
<text x="36" y="332" font-size="12.8" fill="#1F1F1F" text-anchor="start">same, and its API has no CRL</text>
<text x="36" y="350" font-size="12.8" fill="#1F1F1F" text-anchor="start">endpoint.</text>
<rect x="24" y="368" width="276" height="110" rx="7" fill="#F0FDF4" stroke="#15803D" stroke-width="1.3"/>
<rect x="36" y="379" width="57.599999999999994" height="18" rx="4" fill="#FFFFFF" stroke="#15803D" stroke-width="1"/>
<text x="42" y="392" font-size="10.5" fill="#15803D" text-anchor="start" font-weight="bold">SET IT</text>
<text x="36" y="414" font-size="14.2" fill="#15803D" text-anchor="start" font-weight="bold">Revoke = publish + reload</text>
<text x="36" y="434" font-size="12.8" fill="#1F1F1F" text-anchor="start">A revoked partner got in until the</text>
<text x="36" y="452" font-size="12.8" fill="#1F1F1F" text-anchor="start">reload. Run a timer: fetch, nginx -t,</text>
<text x="36" y="470" font-size="12.8" fill="#1F1F1F" text-anchor="start">reload (graceful).</text>
<rect x="24" y="488" width="276" height="110" rx="7" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.3"/>
<rect x="36" y="499" width="42.4" height="18" rx="4" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1"/>
<text x="42" y="512" font-size="10.5" fill="#B91C1C" text-anchor="start" font-weight="bold">TRAP</text>
<text x="36" y="534" font-size="14.2" fill="#B91C1C" text-anchor="start" font-weight="bold">An expired CRL fails everyone</text>
<text x="36" y="554" font-size="12.8" fill="#1F1F1F" text-anchor="start">Every cert from that CA logs &quot;CRL has</text>
<text x="36" y="572" font-size="12.8" fill="#1F1F1F" text-anchor="start">expired&quot;, the revoked one too. A new</text>
<text x="36" y="590" font-size="12.8" fill="#1F1F1F" text-anchor="start">file needs a reload.</text>
<rect x="24" y="608" width="276" height="110" rx="7" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.3"/>
<rect x="36" y="619" width="65.19999999999999" height="18" rx="4" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1"/>
<text x="42" y="632" font-size="10.5" fill="#1D4ED8" text-anchor="start" font-weight="bold">DEFAULT</text>
<text x="36" y="654" font-size="14.2" fill="#1D4ED8" text-anchor="start" font-weight="bold">Only some CA names are advertised</text>
<text x="36" y="674" font-size="12.8" fill="#1F1F1F" text-anchor="start">ssl_client_certificate names go in</text>
<text x="36" y="692" font-size="12.8" fill="#1F1F1F" text-anchor="start">the CertificateRequest;</text>
<text x="36" y="710" font-size="12.8" fill="#1F1F1F" text-anchor="start">ssl_trusted_certificate ones don&#x27;t.</text>
<rect x="316" y="160" width="276" height="58" rx="8" fill="#1F2937" stroke="#1F2937" stroke-width="1.5"/>
<text x="330" y="186" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="bold">2  Client handshake</text>
<text x="330" y="206" font-size="12.5" fill="#D1D5DB" text-anchor="start">OpenSSL checks, NGINX keeps the result</text>
<path d="M594,180 L606,189 L594,198 z" fill="#9CA3AF"/>
<rect x="316" y="230" width="276" height="110" rx="7" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.3"/>
<rect x="328" y="241" width="65.19999999999999" height="18" rx="4" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1"/>
<text x="334" y="254" font-size="10.5" fill="#1D4ED8" text-anchor="start" font-weight="bold">DEFAULT</text>
<text x="328" y="276" font-size="14.2" fill="#1D4ED8" text-anchor="start" font-weight="bold">The handshake always finishes</text>
<text x="328" y="296" font-size="12.8" fill="#1F1F1F" text-anchor="start">Chain, dates and CRL are checked, the</text>
<text x="328" y="314" font-size="12.8" fill="#1F1F1F" text-anchor="start">result is stored, and the client gets</text>
<text x="328" y="332" font-size="12.8" fill="#1F1F1F" text-anchor="start">in to send a request.</text>
<rect x="316" y="350" width="276" height="128" rx="7" fill="#F0FDF4" stroke="#15803D" stroke-width="1.3"/>
<rect x="328" y="361" width="57.599999999999994" height="18" rx="4" fill="#FFFFFF" stroke="#15803D" stroke-width="1"/>
<text x="334" y="374" font-size="10.5" fill="#15803D" text-anchor="start" font-weight="bold">SET IT</text>
<text x="328" y="396" font-size="14.2" fill="#15803D" text-anchor="start" font-weight="bold">ssl_ocsp: revocation, live</text>
<text x="328" y="416" font-size="12.8" fill="#1F1F1F" text-anchor="start">Asks the responder during the</text>
<text x="328" y="434" font-size="12.8" fill="#1F1F1F" text-anchor="start">handshake: no reload. The responder</text>
<text x="328" y="452" font-size="12.8" fill="#1F1F1F" text-anchor="start">is then in the path of every new</text>
<text x="328" y="470" font-size="12.8" fill="#1F1F1F" text-anchor="start">connection...</text>
<rect x="316" y="488" width="276" height="110" rx="7" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.3"/>
<rect x="328" y="499" width="42.4" height="18" rx="4" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1"/>
<text x="334" y="512" font-size="10.5" fill="#B91C1C" text-anchor="start" font-weight="bold">TRAP</text>
<text x="328" y="534" font-size="14.2" fill="#B91C1C" text-anchor="start" font-weight="bold">...unless you cache it</text>
<text x="328" y="554" font-size="12.8" fill="#1F1F1F" text-anchor="start">ssl_ocsp_cache keeps answers until</text>
<text x="328" y="572" font-size="12.8" fill="#1F1F1F" text-anchor="start">they expire, so a revocation waits</text>
<text x="328" y="590" font-size="12.8" fill="#1F1F1F" text-anchor="start">for the cache.</text>
<rect x="316" y="608" width="276" height="128" rx="7" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.3"/>
<rect x="328" y="619" width="42.4" height="18" rx="4" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1"/>
<text x="334" y="632" font-size="10.5" fill="#B91C1C" text-anchor="start" font-weight="bold">TRAP</text>
<text x="328" y="654" font-size="14.2" fill="#B91C1C" text-anchor="start" font-weight="bold">optional_no_ca</text>
<text x="328" y="674" font-size="12.8" fill="#1F1F1F" text-anchor="start">An unknown-CA cert passes as</text>
<text x="328" y="692" font-size="12.8" fill="#1F1F1F" text-anchor="start">FAILED:... and still fills</text>
<text x="328" y="710" font-size="12.8" fill="#1F1F1F" text-anchor="start">$ssl_client_s_dn. Revoked or expired</text>
<text x="328" y="728" font-size="12.8" fill="#1F1F1F" text-anchor="start">certs are still refused.</text>
<rect x="608" y="160" width="276" height="58" rx="8" fill="#1F2937" stroke="#1F2937" stroke-width="1.5"/>
<text x="622" y="186" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="bold">3  HTTP request</text>
<text x="622" y="206" font-size="12.5" fill="#D1D5DB" text-anchor="start">the verdict, before any location</text>
<path d="M886,180 L898,189 L886,198 z" fill="#9CA3AF"/>
<rect x="608" y="230" width="276" height="128" rx="7" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.3"/>
<rect x="620" y="241" width="65.19999999999999" height="18" rx="4" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1"/>
<text x="626" y="254" font-size="10.5" fill="#1D4ED8" text-anchor="start" font-weight="bold">DEFAULT</text>
<text x="620" y="276" font-size="14.2" fill="#1D4ED8" text-anchor="start" font-weight="bold">Refusal is an HTTP response</text>
<text x="620" y="296" font-size="12.8" fill="#1F1F1F" text-anchor="start">496 no cert, 495 failed: sent as 400,</text>
<text x="620" y="314" font-size="12.8" fill="#1F1F1F" text-anchor="start">logged with $ssl_client_verify.</text>
<text x="620" y="332" font-size="12.8" fill="#1F1F1F" text-anchor="start">BIG-IP &#x27;require&#x27; sends a TLS alert</text>
<text x="620" y="350" font-size="12.8" fill="#1F1F1F" text-anchor="start">instead.</text>
<rect x="608" y="368" width="276" height="110" rx="7" fill="#F0FDF4" stroke="#15803D" stroke-width="1.3"/>
<rect x="620" y="379" width="57.599999999999994" height="18" rx="4" fill="#FFFFFF" stroke="#15803D" stroke-width="1"/>
<text x="626" y="392" font-size="10.5" fill="#15803D" text-anchor="start" font-weight="bold">SET IT</text>
<text x="620" y="414" font-size="14.2" fill="#15803D" text-anchor="start" font-weight="bold">error_page 495 496 =403</text>
<text x="620" y="434" font-size="12.8" fill="#1F1F1F" text-anchor="start">JSON or HTML, no iRule. Gate identity</text>
<text x="620" y="452" font-size="12.8" fill="#1F1F1F" text-anchor="start">on $ssl_client_verify = SUCCESS: a</text>
<text x="620" y="470" font-size="12.8" fill="#1F1F1F" text-anchor="start">forgery&#x27;s name is then empty.</text>
<rect x="608" y="488" width="276" height="110" rx="7" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.3"/>
<rect x="620" y="499" width="42.4" height="18" rx="4" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1"/>
<text x="626" y="512" font-size="10.5" fill="#B91C1C" text-anchor="start" font-weight="bold">TRAP</text>
<text x="620" y="534" font-size="14.2" fill="#B91C1C" text-anchor="start" font-weight="bold">The error page&#x27;s CSS is refused</text>
<text x="620" y="554" font-size="12.8" fill="#1F1F1F" text-anchor="start">Sub-resources come without a cert and</text>
<text x="620" y="572" font-size="12.8" fill="#1F1F1F" text-anchor="start">no location can exempt them. Inline</text>
<text x="620" y="590" font-size="12.8" fill="#1F1F1F" text-anchor="start">everything.</text>
<rect x="608" y="608" width="276" height="110" rx="7" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.3"/>
<rect x="620" y="619" width="65.19999999999999" height="18" rx="4" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1"/>
<text x="626" y="632" font-size="10.5" fill="#1D4ED8" text-anchor="start" font-weight="bold">DEFAULT</text>
<text x="620" y="654" font-size="14.2" fill="#1D4ED8" text-anchor="start" font-weight="bold">DN is RFC 2253, no SAN variable</text>
<text x="620" y="674" font-size="12.8" fill="#1F1F1F" text-anchor="start">CN comes last. For SANs (SPIFFE IDs),</text>
<text x="620" y="692" font-size="12.8" fill="#1F1F1F" text-anchor="start">forward $ssl_client_escaped_cert.</text>
<text x="620" y="710" font-size="12.8" fill="#1F1F1F" text-anchor="start">Always set identity headers yourself.</text>
<rect x="900" y="160" width="276" height="58" rx="8" fill="#1F2937" stroke="#1F2937" stroke-width="1.5"/>
<text x="914" y="186" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="bold">4  Upstream connection</text>
<text x="914" y="206" font-size="12.5" fill="#D1D5DB" text-anchor="start">the edge as a TLS client</text>
<rect x="900" y="230" width="276" height="110" rx="7" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.3"/>
<rect x="912" y="241" width="42.4" height="18" rx="4" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1"/>
<text x="918" y="254" font-size="10.5" fill="#B91C1C" text-anchor="start" font-weight="bold">TRAP</text>
<text x="912" y="276" font-size="14.2" fill="#B91C1C" text-anchor="start" font-weight="bold">proxy_ssl_verify is off</text>
<text x="912" y="296" font-size="12.8" fill="#1F1F1F" text-anchor="start">Encrypted isn&#x27;t verified: an impostor</text>
<text x="912" y="314" font-size="12.8" fill="#1F1F1F" text-anchor="start">at the ledger&#x27;s address got the</text>
<text x="912" y="332" font-size="12.8" fill="#1F1F1F" text-anchor="start">request and the edge&#x27;s client cert.</text>
<rect x="900" y="350" width="276" height="110" rx="7" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.3"/>
<rect x="912" y="361" width="42.4" height="18" rx="4" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1"/>
<text x="918" y="374" font-size="10.5" fill="#B91C1C" text-anchor="start" font-weight="bold">TRAP</text>
<text x="912" y="396" font-size="14.2" fill="#B91C1C" text-anchor="start" font-weight="bold">The name is the upstream block&#x27;s</text>
<text x="912" y="416" font-size="12.8" fill="#1F1F1F" text-anchor="start">&quot;ledger&quot;, not ledger.internal. Set</text>
<text x="912" y="434" font-size="12.8" fill="#1F1F1F" text-anchor="start">proxy_ssl_name, and</text>
<text x="912" y="452" font-size="12.8" fill="#1F1F1F" text-anchor="start">proxy_ssl_server_name on for SNI.</text>
<rect x="900" y="470" width="276" height="110" rx="7" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.3"/>
<rect x="912" y="481" width="65.19999999999999" height="18" rx="4" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1"/>
<text x="918" y="494" font-size="10.5" fill="#1D4ED8" text-anchor="start" font-weight="bold">DEFAULT</text>
<text x="912" y="516" font-size="14.2" fill="#1D4ED8" text-anchor="start" font-weight="bold">Keepalive is on (nginx 1.29.7+)</text>
<text x="912" y="536" font-size="12.8" fill="#1F1F1F" text-anchor="start">A cert is checked at the handshake</text>
<text x="912" y="554" font-size="12.8" fill="#1F1F1F" text-anchor="start">only: verified connections kept being</text>
<text x="912" y="572" font-size="12.8" fill="#1F1F1F" text-anchor="start">reused after the address moved.</text>
<rect x="900" y="590" width="276" height="110" rx="7" fill="#F0FDF4" stroke="#15803D" stroke-width="1.3"/>
<rect x="912" y="601" width="57.599999999999994" height="18" rx="4" fill="#FFFFFF" stroke="#15803D" stroke-width="1"/>
<text x="918" y="614" font-size="10.5" fill="#15803D" text-anchor="start" font-weight="bold">SET IT</text>
<text x="912" y="636" font-size="14.2" fill="#15803D" text-anchor="start" font-weight="bold">Verify like a Server SSL profile</text>
<text x="912" y="656" font-size="12.8" fill="#1F1F1F" text-anchor="start">proxy_ssl_trusted_certificate +</text>
<text x="912" y="674" font-size="12.8" fill="#1F1F1F" text-anchor="start">proxy_ssl_verify on + proxy_ssl_name,</text>
<text x="912" y="692" font-size="12.8" fill="#1F1F1F" text-anchor="start">set explicitly.</text>
<rect x="24" y="752" width="1152" height="64" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="40" y="778" font-size="14.5" fill="#1F1F1F" text-anchor="start" font-weight="bold">The BIG-IP lens:</text>
<text x="156" y="778" font-size="14" fill="#1F1F1F" text-anchor="start">&#x27;require&#x27; refuses inside the handshake; NGINX&#x27;s &#x27;on&#x27; behaves like &#x27;request&#x27; plus an iRule that answers in HTTP,</text>
<text x="40" y="800" font-size="14" fill="#1F1F1F" text-anchor="start">with no iRule to write. Revocation is a reload event, not a live lookup, unless you choose OCSP. And upstream TLS starts permissive.</text>
<text x="24" y="832" font-size="12.5" fill="#6B7280" text-anchor="start">#NGINX #mTLS #TLS #F5 #BIGIP #LearningInPublic</text>
</svg>
