# Sprint 4 lab starter: the Lumina Edge Accelerator
# Copy to nginx.conf, complete the TODOs, then from sprints/sprint-4/lab:  ./lab.sh reload
# Requirements: ../README.md section 4. Test: ../test_sprint04.sh
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

# TODO: Each worker can open at least 16384 files.

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format edge '$remote_addr "$request" $status host=$host rt=$request_time '
                    'upstream=$upstream_addr urt=$upstream_response_time';
    access_log logs/access.log edge;

    # TODO: A disk cache under cache/.

    upstream origin {
        server s4-origin:8014;
    }

    server {
        listen 8084;
        # TODO: Port 8084's accept queue holds at least 4096 connections.

        location / {
            proxy_pass http://origin;

            # TODO: The origin receives the client's Host, and different host names never share a cache entry.
            # TODO: Every response carries X-Cache-Status with the cache result for that request.
            # TODO: Responses with no caching headers from the origin are cached for 1 minute.
            #       Responses the origin marks no-store or private, or that set a cookie, are never served from cache.
            # TODO: Requests with an Authorization header always go to the origin, and their responses are never stored.
            # TODO: A burst of concurrent requests for an uncached URL reaches the origin once.
            # TODO: When the origin fails or answers 5xx, clients get the expired cached copy instead of an error.
            # TODO: Refreshing an expired entry never makes a client wait for the origin.
        }
    }
}
