# Sprint 4 Day 3 starting point: Day 2's result, the full cache behavior with default capacity settings
# cp day3_nginx.conf nginx.conf && ./lab.sh up   (or ./lab.sh reload if the lab is already up)
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format edge '$remote_addr "$request" $status host=$host rt=$request_time '
                    'upstream=$upstream_addr urt=$upstream_response_time cache=$upstream_cache_status';
    access_log logs/access.log edge;

    proxy_cache_path cache/lumina levels=1:2 keys_zone=lumina:10m max_size=1g inactive=10m use_temp_path=off;

    upstream origin {
        server s4-origin:8014;
    }

    server {
        listen 8084;

        location / {
            proxy_pass http://origin;
            proxy_set_header Host $host;

            proxy_cache       lumina;
            proxy_cache_key   $scheme$host$request_uri;
            proxy_cache_valid 200 1m;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_cache_bypass $http_authorization;
            proxy_no_cache     $http_authorization;

            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
        }
    }
}
