# Sprint 4 Day 3 Enterprise Side Quest: purge on demand and cache metrics
# Mounted into the container as /etc/nginx/nginx.conf (see day_03_enterprise.md).
# Licensing (R33+) uses the defaults: /etc/nginx/license.jwt, usage reports to product.connect.nginx.com.
user  nginx;
worker_processes  2;
error_log  stderr notice;            # docker logs lumina-cache-plus
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    log_format edge '$remote_addr "$request" $status cache=$upstream_cache_status';
    access_log /dev/stdout edge;

    # purger=on: a background "cache purger" process deletes the files behind wildcard purges
    proxy_cache_path /var/cache/nginx/lumina levels=1:2 keys_zone=lumina:10m max_size=1g
                     inactive=10m use_temp_path=off purger=on;

    # Who may purge: loopback only. Anyone who can purge can empty your cache onto the origin.
    geo $purge_allowed {
        default    0;
        127.0.0.1  1;
    }
    map $request_method:$purge_allowed $purge_method {
        "PURGE:1"  1;
        default    0;
    }
    map $request_method:$purge_allowed $purge_denied {
        "PURGE:0"  1;
        default    0;
    }

    upstream origin {
        zone origin 64k;
        server 127.0.0.1:8014;           # the Sprint 4 lab origin, published on the host by lab.sh
    }

    server {
        listen 8086;
        status_zone lumina_edge;

        location / {
            if ($purge_denied) {
                return 403;
            }

            proxy_pass http://origin;
            proxy_set_header Host $host;

            proxy_cache       lumina;
            proxy_cache_key   $scheme$host$request_uri;
            proxy_cache_valid 200 1h;
            proxy_cache_purge $purge_method;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }

    # Management: API (write access) and dashboard, loopback only
    server {
        listen 127.0.0.1:8085;
        location /api/ {
            api write=on;
        }
        location = /dashboard.html {
            root /usr/share/nginx/html;
        }
    }
}
