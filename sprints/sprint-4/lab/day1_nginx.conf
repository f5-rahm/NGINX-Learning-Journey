# Sprint 4 Day 1 starting point: the edge proxies to the origin, with no cache yet
# cp day1_nginx.conf nginx.conf && ./lab.sh up   (or ./lab.sh reload if the lab is already up)
user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format edge '$remote_addr "$request" $status host=$host rt=$request_time '
                    'upstream=$upstream_addr urt=$upstream_response_time cache=$upstream_cache_status';
    access_log logs/access.log edge;

    upstream origin {
        server s4-origin:8014;
    }

    server {
        listen 8084;

        location / {
            proxy_pass http://origin;
        }
    }
}
