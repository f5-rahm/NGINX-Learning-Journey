# Sprint 6 lab starter: Lumina Edge Functions
# Copy to nginx.conf and starter_lumina.js to lumina.js, complete the TODOs,
# then from sprints/sprint-6/lab:  ./lab.sh reload
# Requirements: ../README.md section 4. Test: ../test_sprint06.sh
#
# The signing key is in the edge container's environment as LUMINA_KEY.
# Sessions: the lumina_session cookie. Revocation list: http://s6-origin:8016/_revoked
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
load_module /usr/lib/nginx/modules/ngx_stream_js_module.so;

user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

# TODO: Every signature (sessions, download links, telemetry) is checked with the key in the
#       LUMINA_KEY environment variable. The key is not written in any configuration or script file.

env	LUMINA_KEY;

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    access_log logs/access.log;

    resolver 127.0.0.11 valid=10s;

    js_path   /lab/;
    js_import lumina from lumina.js;

    js_set $session_user lumina.user;
    js_set $pool lumina.pool;

    js_shared_dict_zone zone=revoked:1m;

    upstream stable { server s6-origin:8016; }
    upstream beta   { server s6-origin:8026; }

    server {
        listen 8096;

        # TODO: A request with a valid session reaches the origin with an X-User header holding the
        #       session's sub. Every other request reaches the origin without X-User, whatever the
        #       client sent.
        # TODO: A malformed session cookie is treated as no session, never as an error.
        # TODO: A request with a valid session whose plan is "beta" goes to the beta pool;
        #       everything else goes to the stable pool.
        # TODO: A session whose jti is on the origin's revocation list stops being valid within
        #       5 seconds of being listed, and is valid again within 5 seconds of being removed.

        # TODO: GET /edge/info is answered by the edge itself, never the origin, with a JSON object:
        #       "client" (the client's address) and "user" (the sub of a valid session, or null).

        location /downloads/ {
            #proxy_pass http://stable;
		js_content lumina.download;

            # TODO: Only valid signed links are served. A missing or wrong signature gets 403; a valid
            #       signature whose expiry has passed gets 410. Refused requests never reach the origin.
        }

        location /api/ {
            #proxy_pass http://stable;
		proxy_pass http://$pool;
		proxy_set_header X-User $session_user;
		js_header_filter lumina.dropLength;
		js_body_filter lumina.maskCards;

            # TODO: POST /api/orders accepts only a JSON object with an integer "qty" from 1 to 100;
            #       anything else gets 400 from the edge and never reaches the origin.
            # TODO: No response under /api/ carries a full card number: each is replaced by
            #       ****-****-****- and its last four digits. The client still receives the
            #       complete response.
        }

	location /api/orders {
		js_content lumina.orders;
	}

	location @files {
		proxy_pass http://$pool;
		proxy_set_header X-User $session_user;
	}

	location @app {
		proxy_pass http://$pool;
		proxy_set_header X-User $session_user;
		js_header_filter lumina.dropLength;
		js_body_filter lumina.maskCards;
	}

	location = /edge/info {
		js_content lumina.info;
	}

	location @refresh {
		js_periodic lumina.refreshRevoked interval=2s;
	}

        location / {
            #proxy_pass http://stable;
		proxy_pass http://$pool;
		proxy_set_header X-User $session_user;
        }
    }
}

stream {
    js_path   /lab/;
    js_import lumina from lumina.js;

    upstream telemetry { server s6-origin:8036; }

    server {
        listen 8097;
	preread_timeout 5s;
	js_preread lumina.telemetry;
        proxy_pass telemetry;

        # TODO: A connection reaches the telemetry intake only if its first line is a valid
        #       "HELLO <device> <sig>". Any other connection is closed without contacting the intake,
        #       and a client that sends nothing is closed within 5 seconds.
    }
}
