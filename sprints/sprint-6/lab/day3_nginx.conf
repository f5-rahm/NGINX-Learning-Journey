# Sprint 6 Day 3 starting point: Day 2's edge (verified sessions, X-User, signed links, card masking,
# order validation, the revocation list). Script: lumina.js (copy day3_lumina.js to lumina.js)
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

env LUMINA_KEY;                     # pass this one variable through to the workers

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format edge '$remote_addr "$request" $status rt=$request_time lang=$client_lang';
    access_log logs/access.log edge;

    js_path   /lab/;                      # where js_import looks for scripts
    js_import lumina from lumina.js;      # the module, under the name "lumina"
    js_set $client_lang lumina.lang;
    js_set $session_user lumina.user;
    js_shared_dict_zone zone=revoked:1m;     # one copy for all workers
    resolver 127.0.0.11 valid=10s;           # Docker's DNS: ngx.fetch needs a resolver for names

    upstream stable { server s6-origin:8016; }
    upstream beta   { server s6-origin:8026; }

    server {
        listen 8096;

        location @refresh {
            js_periodic lumina.refreshRevoked interval=2s;
        }

        location = /edge/hello {
            js_content lumina.hello;
        }

        location = /edge/count {
            js_content lumina.count;
        }

        location = /edge/info {
            js_content lumina.info;
        }

        location /files/ {
            secure_link     $arg_md5,$arg_expires;
            secure_link_md5 "$secure_link_expires$uri lumina-native-secret";
            if ($secure_link = "")  { return 403; }
            if ($secure_link = "0") { return 410; }
            proxy_pass http://stable;
        }

        location /downloads/ {
            js_content lumina.download;
        }

        location @files {
            proxy_pass http://stable;
        }

        location = /api/orders {
            js_content lumina.orders;
        }

        location @app {
            proxy_pass http://stable;
            proxy_set_header X-User $session_user;
        }

        location /api/ {
            proxy_pass http://stable;
            add_header X-Lang $client_lang;
            proxy_set_header X-User $session_user;
            js_header_filter lumina.dropLength;
            js_body_filter lumina.maskCards;
        }

        location / {
            proxy_pass http://stable;
        }
    }
}
