# Sprint 6 lab reference solution: Lumina Edge Functions
# Script: lumina.js (copy solution_lumina.js to lumina.js)
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
load_module /usr/lib/nginx/modules/ngx_stream_js_module.so;

user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

env LUMINA_KEY;                              # R1: the key comes from the environment

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format edge '$remote_addr "$request" $status rt=$request_time '
                    'pool=$pool user=$session_user';
    access_log logs/access.log edge;

    js_path   /lab/;
    js_import lumina from lumina.js;

    js_set $session_user lumina.user;        # R2: sub of a valid session, or empty
    js_set $pool         lumina.pool;        # R4: beta or stable

    js_shared_dict_zone zone=revoked:1m;     # R5: revoked session IDs, shared by all workers
    resolver 127.0.0.11 valid=10s;           # Docker's DNS, for ngx.fetch to s6-origin

    upstream stable { server s6-origin:8016; }
    upstream beta   { server s6-origin:8026; }

    server {
        listen 8096;

        location @refresh {
            js_periodic lumina.refreshRevoked interval=2s;
        }

        location = /edge/info {               # R6
            js_content lumina.info;
        }

        location /downloads/ {                # R7
            js_content lumina.download;
        }

        location = /api/orders {              # R8
            js_content lumina.orders;
        }

        location /api/ {
            proxy_pass http://$pool;
            proxy_set_header X-User $session_user;   # R2: empty value = header not sent
            js_header_filter lumina.dropLength;      # R9
            js_body_filter   lumina.maskCards;
        }

        location @app {
            proxy_pass http://$pool;
            proxy_set_header X-User $session_user;
            js_header_filter lumina.dropLength;
            js_body_filter   lumina.maskCards;
        }

        location @files {
            proxy_pass http://$pool;
            proxy_set_header X-User $session_user;
        }

        location / {
            proxy_pass http://$pool;
            proxy_set_header X-User $session_user;
        }
    }
}

stream {
    js_path   /lab/;
    js_import lumina from lumina.js;

    upstream telemetry { server s6-origin:8036; }

    server {                                  # R10
        listen 8097;
        preread_timeout 5s;
        js_preread lumina.telemetry;
        proxy_pass telemetry;
    }
}
