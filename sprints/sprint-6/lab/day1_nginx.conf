# Sprint 6 Day 1 starting point: the Lumina edge with its first njs functions
# Script: lumina.js (copy day1_lumina.js to lumina.js)
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

user  nginx;
worker_processes  2;
pid   logs/nginx.pid;
error_log  logs/error.log notice;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    log_format edge '$remote_addr "$request" $status rt=$request_time';
    access_log logs/access.log edge;

    js_path   /lab/;                      # where js_import looks for scripts
    js_import lumina from lumina.js;      # the module, under the name "lumina"

    upstream stable { server s6-origin:8016; }
    upstream beta   { server s6-origin:8026; }

    server {
        listen 8096;

        location = /edge/hello {
            js_content lumina.hello;
        }

        location = /edge/count {
            js_content lumina.count;
        }

        location /api/ {
            proxy_pass http://stable;
        }

        location / {
            proxy_pass http://stable;
        }
    }
}
