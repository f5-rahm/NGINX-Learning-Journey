# Northwind edge: the configuration both edge nodes ran before Black Friday.
# One file, mounted into edge-a (10.58.0.11) and edge-b (10.58.0.12) as /lab/edge/nginx.conf.
# Edition: open source (nginx:mainline).
user  nginx;
worker_processes  2;
error_log  /var/log/edge/error.log notice;
pid        /var/run/nginx.pid;

load_module modules/ngx_http_js_module.so;

env SHOP_KEY;                                   # the member-cookie signing key (lab/secrets/shop.key)

events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format edge '$time_iso8601 $hostname $remote_addr "$request" $status $body_bytes_sent '
                    'rt=$request_time member="$member"';
    access_log /var/log/edge/access.log edge;

    # Shoppers arrive through the load balancer (10.58.0.10), which appends their address to X-Forwarded-For
    set_real_ip_from 10.58.0.10;
    real_ip_header   X-Forwarded-For;

    # Member cookies: shop.member returns the verified member ID, or "" (see shop.js)
    js_path   /lab/edge/;
    js_import shop from shop.js;
    js_set    $member shop.member;

    proxy_cache_path /var/cache/nginx/shop keys_zone=shop:10m max_size=200m inactive=1d;

    limit_req_zone $binary_remote_addr zone=checkout:1m rate=5r/s;
    limit_req_status 429;

    upstream origin {
        zone origin 64k;
        server 10.58.0.20:8020;
        keepalive 16;
    }

    server {
        listen 8080;

        add_header X-Edge         $hostname always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host       $host;
        proxy_set_header X-Edge     $hostname;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /catalog/ {
            proxy_cache shop;
            proxy_pass  http://origin;
        }

        location = /checkout {
            limit_req  zone=checkout burst=5 nodelay;
            proxy_pass http://origin;
        }

        location /doorbuster/ {
            proxy_set_header X-Member $member;
            proxy_pass http://origin;
        }

        location / {
            return 404;
        }
    }
}
