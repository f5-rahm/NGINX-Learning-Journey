# Ticket 8: the VIP gate from ticket 7, written in Lua for OpenResty (bf-lua, 10.58.0.30:8080).
# Provided, not a ticket to edit: ./warroom.sh bench runs the same requests against this node and edge-a.
# It does the same work per request as edge-a's njs: verify the member cookie (HMAC-SHA256),
# look the member up in shared memory, refuse non-VIPs at the edge, log the request.
worker_processes  2;
error_log  /var/log/edge/error.log notice;
pid        /var/run/nginx.pid;

env SHOP_KEY;

events { worker_connections 4096; }

http {
    log_format edge '$time_iso8601 $hostname $remote_addr "$request" $status $body_bytes_sent '
                    'rt=$request_time member="$member"';
    access_log /var/log/edge/access.log edge;

    lua_package_path "/lab/openresty/?.lua;;";
    lua_shared_dict vip 1m;                         # like js_shared_dict_zone: per node, shared by its workers

    init_by_lua_block {
        shop = require "shop"                       -- loaded once, in the master, before the workers fork
    }

    upstream origin {
        server 10.58.0.20:8020;
        keepalive 16;
    }

    server {
        listen 8080;

        set $member "";

        location /doorbuster/ {
            access_by_lua_block {
                local id = shop.member()
                ngx.var.member = id
                if id == "" or ngx.shared.vip:get(id) ~= "1" then
                    return ngx.exit(403)
                end
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Member $member;
            proxy_pass http://origin;
        }

        location /ops/vip/ {
            allow 10.58.0.5;
            deny  all;
            content_by_lua_block { shop.vip_admin() }
        }

        location / {
            return 404;
        }
    }
}
