# Northwind edge: the configuration both edge nodes ran before Black Friday.
# One file, mounted into edge-a (10.58.0.11) and edge-b (10.58.0.12) as /lab/edge/nginx.conf.
# Edition: open source (nginx:mainline).
user  nginx;
worker_processes  2;
error_log  /var/log/edge/error.log notice;
pid        /var/run/nginx.pid;

load_module modules/ngx_http_js_module.so;

env SHOP_KEY;                                   # the member-cookie signing key (lab/secrets/shop.key)

events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format edge '$time_iso8601 $hostname $remote_addr "$request" $status $body_bytes_sent '
                    'rt=$request_time member="$member" cache=$upstream_cache_status';   # ticket 3
    access_log /var/log/edge/access.log edge;

    # Shoppers arrive through the load balancer (10.58.0.10), which appends their address to X-Forwarded-For
    set_real_ip_from 10.58.0.10;
    real_ip_header   X-Forwarded-For;

    # Member cookies: shop.member returns the verified member ID, or "" (see shop.js)
    js_path   /lab/edge/;
    js_import shop from shop.js;
    js_set    $member shop.member;

    # Ticket 7: VIPs in shared memory, per node
    js_shared_dict_zone zone=vip:1m;
    js_set    $vip shop.vip;

    # Ticket 1: the ops team (10.58.0.5) can refresh one cached page with X-Refresh: 1.
    # geo reads $remote_addr after realip, so a shopper can't claim to be ops through the load balancer.
    geo $ops {
        default    0;
        10.58.0.5  1;
    }
    map "$ops:$http_x_refresh" $refresh {
        "~^1:."    1;
        default    0;
    }

    # Ticket 2: a generation per section of the catalog, part of the cache key. Bumping a section's
    # generation in cache_gen.conf (and reloading) moves that section to new keys: everything in it
    # is fetched again, and every other section keeps its entries.
    map $uri $cache_gen {
        include /lab/edge/cache_gen.conf;
        default "";
    }

    # Tickets 4 and 5: refused networks, in their own file (a reload applies a change).
    # geo matches $remote_addr after realip, and the most specific network wins.
    geo $denied {
        default 0;
        include /lab/edge/denylist.conf;
    }

    proxy_cache_path /var/cache/nginx/shop keys_zone=shop:10m max_size=200m inactive=1d;

    limit_req_zone $binary_remote_addr zone=checkout:1m rate=5r/s;
    limit_req_status 429;

    upstream origin {
        zone origin 64k;
        server 10.58.0.20:8020;
        keepalive 16;
    }

    server {
        listen 8080;

        if ($denied) {                            # server level: every location, before any of them runs
            return 403;
        }

        add_header X-Edge         $hostname always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host       $host;
        proxy_set_header X-Edge     $hostname;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /catalog/ {
            proxy_cache        shop;
            proxy_cache_bypass $refresh;          # fetch a fresh copy and store it in place of the old one
            proxy_cache_key    $scheme://$proxy_host$request_uri$cache_gen;   # the default key is "$scheme://$proxy_host$request_uri"
            proxy_pass         http://origin;
        }

        location = /checkout {
            limit_req  zone=checkout burst=5 nodelay;
            proxy_pass http://origin;
        }

        location /doorbuster/ {
            if ($vip != "1") {                    # ticket 7: VIPs only until the sale opens
                return 403;
            }
            proxy_set_header X-Member $member;
            proxy_pass http://origin;
        }

        location /ops/vip/ {                      # ticket 7: the ops team's VIP list, on each node
            allow 10.58.0.5;
            deny  all;
            js_content shop.vipAdmin;
        }

        location / {
            return 404;
        }
    }
}
