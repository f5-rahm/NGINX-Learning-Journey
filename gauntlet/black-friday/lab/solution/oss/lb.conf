# Northwind load balancer (10.58.0.10, published on the host as :8100).
# Shoppers connect here; it spreads their requests over the two edge nodes.
# It plays the cloud load balancer in front of the edge tier: plain NGINX open source in both editions.
user  nginx;
worker_processes  2;
error_log  /var/log/lb/error.log notice;
pid        /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    access_log off;

    upstream edges {
        hash $remote_addr consistent;   # ticket 6: each shopper always lands on the same edge, so one node counts all of their requests
        server 10.58.0.11:8080;     # edge-a
        server 10.58.0.12:8080;     # edge-b
        keepalive 32;
    }

    server {
        listen 8100;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection      "";
            proxy_set_header Host            $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://edges;
        }
    }
}
