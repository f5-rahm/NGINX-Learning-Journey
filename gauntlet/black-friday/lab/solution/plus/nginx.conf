# Northwind edge: the configuration both edge nodes ran before Black Friday.
# One file, mounted into edge-a (10.58.0.11) and edge-b (10.58.0.12) as /lab/edge/nginx.conf.
# Edition: NGINX Plus ($PLUS_IMAGE from ~/plus/plus.env).
user  nginx;
worker_processes  2;
error_log  /var/log/edge/error.log notice;
pid        /var/run/nginx.pid;

load_module modules/ngx_http_js_module.so;

env SHOP_KEY;                                   # the member-cookie signing key (lab/secrets/shop.key)

events { worker_connections 4096; }

# Licensing. Plus looks for license.jwt next to the main config file by default, and this one is
# /lab/edge/nginx.conf, so the paths are spelled out: the license mounted from ~/plus, the state per node.
mgmt {
    license_token /etc/nginx/license.jwt;
    state_path    /var/lib/nginx/state;
}

# Ticket 4: the two nodes share the shared memory zones marked "sync" (the same file on both nodes;
# a node that finds itself in the list ignores that entry)
stream {
    server {
        listen 9000;
        zone_sync;
        zone_sync_server 10.58.0.11:9000;
        zone_sync_server 10.58.0.12:9000;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format edge '$time_iso8601 $hostname $remote_addr "$request" $status $body_bytes_sent '
                    'rt=$request_time member="$member"';
    access_log /var/log/edge/access.log edge;

    # Shoppers arrive through the load balancer (10.58.0.10), which appends their address to X-Forwarded-For
    set_real_ip_from 10.58.0.10;
    real_ip_header   X-Forwarded-For;

    # Member cookies: shop.member returns the verified member ID, or "" (see shop.js)
    js_path   /lab/edge/;
    js_import shop from shop.js;
    js_set    $member shop.member;

    # Ticket 7: VIP members, by verified member ID: "1" is a VIP, "0" (or no entry) isn't.
    # Changed through the API, synced across the nodes. njs verifies the cookie; keyval looks up the result.
    keyval_zone zone=vip:1m timeout=1d sync;
    keyval      $member $vip zone=vip;

    # Ticket 1: PURGE removes cached pages, for the ops team (10.58.0.5) only.
    # geo reads $remote_addr after realip, so a shopper can't claim to be ops through the load balancer.
    geo $ops {
        default    0;
        10.58.0.5  1;
    }
    map $request_method $is_purge {
        PURGE      1;
        default    0;
    }
    map "$is_purge:$ops" $purge_method {          # a PURGE from ops: proxy_cache_purge acts on it
        "1:1"      1;
        default    0;
    }
    map "$is_purge:$ops" $purge_refused {         # a PURGE from anyone else: 403, never proxied
        "1:0"      1;
        default    0;
    }

    # Tickets 4 and 5: refused networks, changed through the API with no reload, synced across the nodes.
    # type=ip: keys are addresses or CIDR ranges; "1" refuses, "0" lets in.
    keyval_zone zone=denylist:1m type=ip timeout=1d sync;
    keyval      $remote_addr $denied zone=denylist;

    proxy_cache_path /var/cache/nginx/shop keys_zone=shop:10m max_size=200m inactive=1d;

    # Ticket 6: one count for the whole cluster. A new zone: the master refuses to add "sync" to a running zone.
    limit_req_zone $binary_remote_addr zone=checkout_all:1m rate=5r/s sync;
    limit_req_status 429;

    upstream origin {
        zone origin 64k;
        server 10.58.0.20:8020;
        keepalive 16;
    }

    server {
        listen 8080;

        if ($denied) {                            # server level: every location, before any of them runs
            return 403;
        }

        add_header X-Edge         $hostname always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host       $host;
        proxy_set_header X-Edge     $hostname;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /catalog/ {
            if ($purge_refused) {
                return 403;
            }
            proxy_cache       shop;
            proxy_cache_purge $purge_method;
            proxy_pass        http://origin;
        }

        location = /checkout {
            limit_req  zone=checkout_all burst=5 nodelay;
            proxy_pass http://origin;
        }

        location /doorbuster/ {
            if ($vip != "1") {                    # ticket 7: VIPs only until the sale opens
                return 403;
            }
            proxy_set_header X-Member $member;
            proxy_pass http://origin;
        }

        location / {
            return 404;
        }
    }

    # Ticket 3: the NGINX Plus API and dashboard on :8085, for the ops team and the lab host only
    # (the host is the network's gateway, 10.58.0.1; it reaches edge-a as 127.0.0.1:8085, edge-b as :8105)
    server {
        listen 8085;
        allow  10.58.0.5;
        allow  10.58.0.1;
        deny   all;

        location /api/ {
            api write=on;                         # ticket 4: the ops team changes key-value data here
        }
        location = /dashboard.html {
            root /usr/share/nginx/html;
        }
    }
}
